    window.HK_BUILD = '20261112000930';
    /* Pengganti google.script.run: memanggil server lewat POST {fn, args} */
    (function () {
      function runner() {
        var ok = function () {}, bad = function () {};
        var p = new Proxy({}, { get: function (t, k) {
          if (k === 'withSuccessHandler') return function (f) { ok = f; return p; };
          if (k === 'withFailureHandler') return function (f) { bad = f; return p; };
          return function () {
            var args = Array.prototype.slice.call(arguments);
            fetch(window.HK_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: k, args: args }), redirect: 'follow' })
              .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
              .then(function (j) { j.ok ? ok(j.result) : bad(new Error(j.error)); })
              .catch(function (e) { var m = String((e && e.message) || e); bad(new Error(/Failed to fetch|NetworkError|Load failed/i.test(m) ? 'network' : m)); });
          };
        } });
        return p;
      }
      window.google = { script: { get run() { return runner(); } } };
    })();

/* ---------------- SERVER CALLS ---------------- */
function call(fn,args){
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(res).withFailureHandler(e=>{
      const m=String((e&&e.message)||e||'Gagal');const i=m.indexOf('|');
      rej(i>0&&/^[A-Z]+$/.test(m.slice(0,i))?{code:m.slice(0,i),message:m.slice(i+1)}:{code:'ERR',message:/network|NetworkError|failed to fetch/i.test(m)?'Koneksi terputus. Periksa internet lalu coba lagi.':m});
    })[fn].apply(null,args);
  });
}
async function api(fn,...args){
  S.busy++;renderBusy();
  try{return await call(fn,[S.token].concat(args))}
  catch(e){
    if(e.code==='AUTH'){doLocalLogout(e.message);throw e}
    if(e.code==='MUSTCHANGE'){if(S.me)S.me.mustChange=true;render();throw e}
    throw e;
  }finally{S.busy--;renderBusy()}
}
async function run(fn,ok){try{const r=await fn();if(ok)toast(typeof ok==='function'?ok(r):ok);return r}catch(e){if(e.code!=='AUTH'&&e.code!=='MUSTCHANGE')toast(e.message||'Gagal.');return null}}

/* satu permintaan getState pada satu waktu: cegah notifikasi dobel & beban server.
   Jika dipanggil saat masih memuat (mis. setelah menyimpan), dijalankan sekali lagi sesudahnya agar data terbaru terambil. */
let refreshing=null,refreshNext=null;
function refresh(silent){
  if(!S.token||!S.me||S.me.mustChange)return Promise.resolve();
  if(refreshing){if(!refreshNext)refreshNext=refreshing.then(()=>{refreshNext=null;return refresh(silent)});return refreshNext}
  refreshing=doRefresh(silent,false).finally(()=>{refreshing=null});return refreshing;
}
async function doRefresh(silent,again){
  try{
    /* kirim tanda versi data terakhir: jika tidak ada perubahan, server cukup menjawab "same" (hemat & cepat).
       Muat ulang manual (tidak silent) selalu mengambil data lengkap. */
    const since=silent&&S.loaded&&S.tag&&S.stateDate===S.today?S.tag:'';
    const t0=Date.now();const st=await api('getState',S.today||'',since);syncClock(st.serverTime,t0,Date.now());
    if(st.same){const lbl=clk(S.lastSync),hadErr=!!S.syncErr;S.lastSync=nowS();S.syncErr='';S.srvVer=+st.version||0;
      if(S.srvVer>CLIENT_VERSION&&window.HK_API_URL&&reloadOk())return hardReload();
      if(hadErr||clk(S.lastSync)!==lbl)render();return}
    /* hari berganti (ditutup admin atau lewat tengah malam): pindah ke tanggal operasional baru */
    if(st.date!==st.today&&!again){const old=S.today;S.today=st.today;delete S.report[old];
      if(old&&S.loaded)toast(st.day&&st.day.closed?`Hari ${fmtShort(old)} sudah ditutup. Tampilan pindah ke ${fmtShort(st.today)}.`:`Tampilan pindah ke ${fmtShort(st.today)}.`);
      return doRefresh(silent,true)}
    const prev=(S.loaded&&S.stateDate===st.date)?S.rooms:null;S.stateDate=st.date;
    S.srvVer=+st.version||0;if(S.srvVer>CLIENT_VERSION&&window.HK_API_URL&&reloadOk())return hardReload();
    S.tag=st.tag||'';S.me=st.me;S.users=st.users;detectEvents(prev,st.rooms);S.rooms=st.rooms;S.uploads=st.uploads||[];S.day=st.day||null;if(st.days)S.days=st.days;if(st.floors)S.hotelFloors=st.floors;S.incharge=st.incharge||null;if(st.deletedNames)S.deletedNames=st.deletedNames;S.unclosed=st.unclosed||[];S.dayInfo[st.date]=st.day||null;S.loaded=true;S.lastSync=nowS();S.syncErr='';
    S.today=st.today;if(!S.reportDate)S.reportDate=st.today;
    checkQueueAlerts();
    render();
  }catch(e){if(e.code!=='AUTH'&&e.code!=='MUSTCHANGE'){S.syncErr=e.message;if(!silent)toast(e.message);render()}}
}

/* ---------------- PDF TASK SHEET PARSER (Opera hsk_tasksheet) ---------------- */
function parseTaskSheet(pages){
  const COLS=[['flag',0,20],['room',20,45],['type',45,70],['rs',70,95],['fo',95,120],['am',120,140],['pm',140,165],['resv',165,240],['next',240,282],['td',282,297],['title',297,335],['name',335,385],['arr',385,428],['arrt',428,468],['dep',468,505],['dept',505,545],['vip',545,562],['adl',562,578],['chl',578,598],['spec',598,660],['instr',660,1e9]];
  const colOf=x=>{for(const c of COLS)if(x>=c[1]&&x<c[2])return c[0]};
  let date='',att='',seq=0,inSum=false,expected=0;const rows=[],warnings=[];
  for(const pg of pages){
    const words=[];
    for(const it of pg.items){
      const s=it.str;if(!s||!s.trim())continue;const L=s.length;let i=0;
      for(const part of s.split(/(\s+)/)){if(part.trim())words.push({x:it.x+(L?it.w*i/L:0),y:it.y,t:part});i+=part.length}
    }
    words.sort((a,b)=>a.y-b.y||a.x-b.x);
    const lines=[];
    for(const w of words){const l=lines[lines.length-1];if(l&&w.y-l.y<=1.6)l.ws.push(w);else lines.push({y:w.y,ws:[w]})}
    let inRows=false,cur=null;
    for(const l of lines){
      l.ws.sort((a,b)=>a.x-b.x);
      const txt=l.ws.map(w=>w.t).join(' ');
      if(!date){const m=txt.match(/Task Date From\s+(\d{2})\/(\d{2})\/(\d{2})/);if(m)date='20'+m[3]+'-'+m[2]+'-'+m[1]}
      if(/Report Summary/.test(txt))inSum=true;
      /* ringkasan akhir laporan Opera: "Total <jml task sheet> <Total Rooms> ..." dipakai untuk memeriksa jumlah kamar terbaca */
      if(inSum&&/^Total\b/.test(txt)){const nums=txt.match(/\d+/g)||[];if(nums.length>=6)expected=+nums[1]}
      if(/^Instructions\b/.test(txt)){att=l.ws.filter(w=>w.x>90).map(w=>w.t).join(' ').trim();continue}
      if(l.ws[0].t==='No'&&l.ws[0].x<40&&l.y<200){inRows=true;continue}
      if(/^(Total|Filter|Page|Task Code|Show )/.test(txt)||l.y>=546){inRows=false;cur=null;continue}
      if(!inRows)continue;
      const d={};for(const w of l.ws){const c=colOf(w.x);(d[c]=d[c]||[]).push(w.t)}
      const rw=d.room&&d.room[0];
      if(rw&&/^\d{2,5}[A-Z]?$/.test(rw)){cur={};for(const k in d)cur[k]=d[k].join(' ');cur.att=att;cur.seq=seq++;rows.push(cur)}
      else if(cur){
        /* baris lanjutan: kalau ada tanggal Arrival baru, itu reservasi tamu berikutnya (kamar bertanda !) */
        const tgt=(d.arr&&/^\d{2}\/\d{2}\/\d{2}$/.test(d.arr[0]))?(cur.nx={}):(cur.nx||cur);
        for(const k in d)tgt[k]=((tgt[k]||'')+' '+d[k].join(' ')).trim();
      }
    }
  }
  const seen=new Set(),out=[];
  for(const r of rows){
    if(seen.has(r.room)){warnings.push('Kamar '+r.room+' muncul dua kali; yang kedua diabaikan.');continue}seen.add(r.room);
    const resv=(r.resv||'').replace(/^\d+\s*/,'').trim();
    out.push({room:r.room,type:r.type||'',resv:resv||'-',category:/due out|departed|check(ed)? ?out/i.test(resv)?'CHECKOUT':'STAYOVER',
      arrivalFlag:/!/.test(r.flag||''),skip:/#/.test(r.flag||''),dep:r.dep||'',vip:r.vip||'',adults:r.adl||'',guest:[r.title,r.name].filter(Boolean).join(' ').replace(/\s+/g,' ').trim(),children:r.chl||'',
      specials:[r.spec,r.nx&&r.nx.spec].filter(Boolean).join(' · '),instructions:[r.instr,r.nx&&r.nx.instr].filter(Boolean).join(' · '),attendant:r.att||'',seq:r.seq,
      nextArr:((r.nx&&r.nx.arrt)||r.next||'').replace(/^00:00$/,''),nextAdults:(r.nx&&r.nx.adl)||''});
  }
  if(out.some(r=>!r.attendant))warnings.push('Ada kamar tanpa nama attendant; kamar itu masuk sebagai belum di-assign.');
  if(expected&&expected!==out.length)warnings.unshift(`Perhatian: task sheet mencatat ${expected} kamar, tetapi yang terbaca ${out.length} kamar. Cocokkan dengan laporan Opera sebelum import, lalu kabari pengembang.`);
  return {date,rows:out,warnings};
}
let pdfReady=null;
function loadPdfJs(){
  if(pdfReady)return pdfReady;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const add=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('pdfjs-load'));document.head.appendChild(s)});
  pdfReady=add(base+'pdf.min.js').then(()=>add(base+'pdf.worker.min.js')).then(()=>{
    const L=window.pdfjsLib||window['pdfjs-dist/build/pdf'];if(!L)throw new Error('pdfjs-load');
    if(!window.pdfjsWorker){L.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([`importScripts('${base}pdf.worker.min.js')`],{type:'text/javascript'}))}
    return L;
  }).catch(e=>{pdfReady=null;throw e});
  return pdfReady;
}

const nextDay=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+1)).toISOString().slice(0,10)};

    <div class="grid grid-cols-2 gap-2"><div><p class="text-[10px] font-bold uppercase tracking-wider text-rose-600">Checkout</p><p class="text-2xl font-extrabold text-slate-900 tracking-tight">${v(co)}</p></div><div><p class="text-[10px] font-bold uppercase tracking-wider text-indigo-600">Stayover</p><p class="text-2xl font-extrabold text-slate-900 tracking-tight">${v(so)}</p></div></div>
    ${sub?`<p class="text-xs text-slate-500 -mt-1">${sub}</p>`:''}</div>`;

const avgOf=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
function kpi(icon,iconCls,lbl,value,sub,x=''){

    <div><p class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">${value}</p>${sub?`<p class="text-xs text-slate-500 mt-0.5">${sub}</p>`:''}</div></div>`;

      <div class="flex flex-wrap gap-1.5 min-w-0">${by[f].sort(roomSort).map(r=>`<span title="${esc(r.room)} · ${isDnd(r)?dndLbl(r):ST[r.status].l} · ${esc(nameOf(r.assignedTo))}${r.arrivalFlag?' · Arrival':''}" class="relative w-12 h-8 rounded-lg ring-1 ring-inset ${isDnd(r)?'bg-slate-800 text-white ring-slate-900':ST[r.status].tile} ${isQ(r)?'outline outline-2 outline-offset-1 outline-rose-600':''} text-[11px] font-bold flex items-center justify-center">${esc(r.room)}${isQ(r)?`<span class="absolute -top-1.5 -left-1.5 w-4 h-4 rounded-full bg-rose-600 text-white flex items-center justify-center ring-2 ring-white">${ic('bell','w-2.5 h-2.5')}</span>`:''}${r.arrivalFlag&&r.status!=='COMPLETED'?'<span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-fuchsia-500 ring-2 ring-white"></span>':''}</span>`).join('')}</div></div>`}).join('')}

function viewDash(){

  const drop=card(`<div class="p-4 sm:p-5 space-y-4">

    else if(I.state==='done'){const r=I.result;side=card(`<div class="p-5 space-y-4"><div class="flex items-center gap-3"><span class="w-11 h-11 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center">${ic('check','w-6 h-6')}</span><div><p class="font-bold text-slate-900">Import selesai</p><p class="text-sm text-slate-500">${esc(fmtDate(r.date))}</p></div></div>

/* Salah upload? Hapus task sheet hari ini: kamar yang belum dimulai dihapus, kamar yang sudah dikerjakan tetap disimpan */
const sheetUntouched=r=>r.status==='PENDING'&&!r.dndReason&&!r.retCount;
function delSheetCard(){
  if(!canUpload()||!S.rooms.length||(S.day&&S.day.closed))return '';
  const n=S.rooms.filter(sheetUntouched).length,k=S.rooms.length-n;
  return card(`<div class="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center gap-3"><span class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center shrink-0">${ic('trash','w-5 h-5')}</span>
    <div class="flex-1 min-w-0"><p class="text-sm font-bold text-slate-900">Salah upload task sheet?</p><p class="text-xs text-slate-500">${esc(fmtShort(S.today))} · ${S.rooms.length} kamar${k?` · <b class="text-amber-700">${k} sudah dikerjakan</b> (tetap disimpan)`:''}</p></div>
    <button data-act="delSheetAsk" ${n?'':'disabled'} class="${bc('dangerSoft','sm')} shrink-0 disabled:opacity-40">${ic('trash','w-3.5 h-3.5')} Hapus task sheet</button></div>`);
}
function importPreview(){
  const I=S.imp,rows=I.parsed.rows;
  const atts={};for(const r of rows){const k=String(r.attendant||'').trim()||'(tanpa nama)';const a=atts[k]=atts[k]||{n:0,co:0,so:0};a.n++;r.category==='CHECKOUT'?a.co++:a.so++}
  /* cocokkan ke akun lewat USERNAME (Galang Pratama → galang.pratama); cadangan: nama akun */
  const hks=S.users.filter(u=>u.role==='housekeeper'),byU={},byN={};hks.forEach(u=>{if(u.username)byU[u.username]=u;byN[norm(u.name)]=u});
  const auto=n=>byU[unameOf(n)]||byN[norm(n)]||null,byId=Object.fromEntries(hks.map(u=>[u.id,u])),M=I.map||{};
  /* pilihan manual di pratinjau (mis. nama di task sheet typo): id akun, '__new' = buat akun baru, kosong = otomatis */
  const acct=n=>{const c=M[n];return c==='__new'?null:c&&byId[c]?byId[c]:auto(n)};
  const isNew=n=>n!=='(tanpa nama)'&&!acct(n);
  const opts=hks.slice().sort((a,b)=>a.name.localeCompare(b.name));
  /* akun yang sudah dipakai attendant lain di file ini (otomatis atau dipilih manual) tidak ditawarkan lagi */
  const usedBy={};Object.keys(atts).forEach(n=>{if(n==='(tanpa nama)')return;const a=acct(n);if(a&&!usedBy[a.id])usedBy[a.id]=n});
  const optsFor=n=>opts.filter(u=>!usedBy[u.id]||usedBy[u.id]===n);
  const newCount=Object.keys(atts).filter(isNew).length,co=rows.filter(r=>r.category==='CHECKOUT').length;
  const ex=I.date===S.today?S.rooms:(S.report[I.date]||null);
  const inFile=new Set(rows.map(r=>r.room));
  const missing=ex?ex.filter(r=>!inFile.has(r.room)&&r.status==='PENDING').length:0;
  return card(`${cardHead('Pratinjau',esc(I.fileName))}
    <div class="p-4 sm:p-5 space-y-4">
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="rounded-xl bg-slate-50 p-3"><p class="text-2xl font-extrabold text-slate-900">${rows.length}</p><p class="text-[11px] text-slate-500">kamar</p></div>
        <div class="rounded-xl bg-rose-50 p-3"><p class="text-2xl font-extrabold text-rose-700">${co}</p><p class="text-[11px] text-rose-700">checkout</p></div>
        <div class="rounded-xl bg-indigo-50 p-3"><p class="text-2xl font-extrabold text-indigo-700">${rows.length-co}</p><p class="text-[11px] text-indigo-700">stayover</p></div></div>
      <div class="flex flex-wrap items-center justify-between gap-3"><label for="f-impdate" class="text-sm font-semibold text-slate-700">Tanggal tugas</label><input type="date" id="f-impdate" value="${I.date}" class="${selectCls}"></div>
      <p class="text-xs text-slate-500">${rows.filter(r=>r.arrivalFlag).length} kamar <b class="text-fuchsia-700">! Arrival</b> · ${rows.filter(r=>r.skip).length} kamar <b>#&nbsp;Skip</b></p>
      <div><p class="text-sm font-bold text-slate-900 mb-2">${Object.keys(atts).length} attendant${newCount?` <span class="font-medium text-brand-700">· ${newCount} akun baru</span>`:''}</p>
        <div class="grid gap-1.5 max-h-96 overflow-y-auto pr-1">${Object.entries(atts).map(([n,a])=>{const c=M[n]||'',ac=acct(n),manual=!!c,au=auto(n);
          const line=n==='(tanpa nama)'?'kamar tanpa attendant, assign manual nanti':ac?'@'+esc(ac.username||'')+(norm(ac.name)!==norm(n)?' · '+esc(ac.name):'')+(manual?' · dipilih manual':''):'akun housekeeper baru akan dibuat'+(manual?' · dipilih manual':'');
          return `<div class="rounded-xl ring-1 ring-inset ${manual?'ring-brand-300 bg-brand-50/40':'ring-slate-200'} px-2.5 py-2 flex flex-col gap-2"><div class="flex items-center gap-2.5 min-w-0">${avatar(n,'w-7 h-7 text-[10px]')}<span class="flex-1 min-w-0"><span class="block text-sm font-semibold text-slate-800 truncate">${esc(n)}</span><span class="block text-[11px] ${isNew(n)?'text-brand-700':'text-slate-500'} truncate">${line}</span></span>${isNew(n)?chip('baru','bg-brand-50 text-brand-700 ring-brand-200'):''}<span class="text-xs text-slate-500 whitespace-nowrap"><b class="text-slate-800">${a.n}</b> · <span class="text-rose-600">${a.co}</span>/<span class="text-indigo-600">${a.so}</span></span></div>
            ${n==='(tanpa nama)'?'':`<select data-impmap="${esc(n)}" aria-label="Akun untuk ${esc(n)}" class="${selectCls} !py-1.5 text-xs w-full"><option value="" ${c===''?'selected':''}>Otomatis: ${au?'@'+esc(au.username||au.name):'buat akun baru'}</option><optgroup label="${optsFor(n).length?'Pilih akun yang belum terpakai':'Semua akun sudah terpakai di file ini'}">${optsFor(n).map(u=>`<option value="${esc(u.id)}" ${c===u.id?'selected':''}>${esc(u.name)}${u.username?' · @'+esc(u.username):''}${u.active?'':' (nonaktif)'}</option>`).join('')}</optgroup><option value="__new" ${c==='__new'?'selected':''}>Buat akun baru "${esc(n)}"</option></select>`}</div>`}).join('')}</div>
        <p class="text-[11px] text-slate-400 mt-1.5">Total · <span class="text-rose-600">checkout</span>/<span class="text-indigo-600">stayover</span> · Nama typo? Pilih akun yang benar di daftar pilihan.</p></div>
      ${I.parsed.warnings.length?`<div class="rounded-xl bg-amber-50 ring-1 ring-inset ring-amber-200 p-3 text-xs text-amber-900">${I.parsed.warnings.slice(0,5).map(esc).join('<br>')}</div>`:''}
      ${ex&&ex.length?`<div class="rounded-xl bg-brand-50 ring-1 ring-inset ring-brand-200 p-3 text-xs text-brand-900 space-y-2"><p>Sudah ada <b>${ex.length}</b> kamar di tanggal ini. Kamar yang sama diperbarui; yang sedang/sudah dikerjakan tidak diubah penugasannya.</p>
        ${missing?`<label class="flex items-start gap-2"><input type="checkbox" id="f-rmmissing" data-keep class="mt-0.5 accent-brand-600" ${dv('f-rmmissing',false)?'checked':''}> Hapus ${missing} kamar yang belum dimulai dan tidak ada di file ini</label>`:''}</div>`:''}
      <div class="flex gap-2 pt-1"><button data-act="impCancel" class="${bc('ghost')}">Batal</button><button data-act="impGo" class="${bc('primary','md','flex-1')}">${ic('upload')} Import ${rows.length} kamar</button></div></div>`);
}

    return `<button data-act="openAssign" data-id="${h.id}" class="text-left rounded-2xl ring-1 ring-inset ring-slate-200 hover:ring-brand-300 hover:bg-brand-50/30 p-3.5 space-y-2.5 transition"><div class="flex items-center gap-3">${avatar(h.name)}<div class="min-w-0 flex-1"><p class="font-semibold text-slate-900 truncate">${esc(h.name)}</p><p class="text-xs text-slate-500">Ketuk untuk assign kamar</p></div><span class="text-sm font-extrabold text-slate-900">${m.length}</span></div>

function timeline(r,isSO){
  const step=(t,v,c)=>`<div class="flex-1 min-w-0"><p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">${t}</p><p class="font-mono font-bold ${c||'text-slate-900'}">${v}</p></div>`;
  const sep=ic('chevron','w-3 h-3 text-slate-300');
  return `<div class="flex items-center gap-1.5 rounded-xl bg-slate-50 px-3 py-2.5">${step('Start',clk(r.startAt))}${sep}${step('Finish',clk(r.finishHkAt))}${isSO?'':sep+step('Cek SPV',clk(r.spvStartAt),'text-violet-700')}${sep}${step('Ready',isSO?'auto':clk(r.finishSpvAt),'text-brand-700')}</div>`;
}
function viewInspect(){

function recapCard(r,undo){

    <div class="flex items-start justify-between gap-3"><div class="min-w-0"><div class="flex items-center gap-2"><p class="text-xl font-extrabold text-slate-900">${esc(r.room)}</p>${catChip(r.category)}</div><p class="text-xs text-slate-500 mt-1 truncate">${esc(nameOf(r.assignedTo))}${r.spvId?' · SPV '+esc(nameOf(r.spvId)):''}</p></div>
      ${undo?`<button data-act="ask" data-type="undo" data-id="${esc(r.room)}" class="${bc('soft','sm')}">${ic('undo','w-3.5 h-3.5')} Undo</button>`:stChip('COMPLETED')}</div>${r.retCount?`<p class="text-[11px] font-semibold text-orange-700">↩ Pernah dikembalikan ke RA ${r.retCount}x · ${esc(RETL[r.retReason]||'')}${r.retNote?' · "'+esc(r.retNote)+'"':''}</p>`:''}

/* blok 8 waktu: dipakai di Rekap dan Laporan (HP) */
function timeBlock(r){
  const t=timesOf(r),so=isSO(r);
  const cell=(l,v,c)=>`<div class="min-w-0"><p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold truncate">${l}</p><p class="font-mono font-bold text-[13px] ${c||'text-slate-900'}">${v}</p></div>`;
  const row=(title,tc,a,b,c)=>`<div class="rounded-xl bg-slate-50 px-3 py-2.5"><p class="text-[11px] font-bold ${tc} mb-1">${title}</p><div class="grid grid-cols-3 gap-2">${a}${b}${c}</div></div>`;
  return `<div class="space-y-2">
    ${row('Housekeeper','text-amber-700',cell('Start',t.hkStart+(t.ret?`<span class="block text-[10px] text-orange-600">↩ ${t.redoStart}</span>`:'')),cell('Selesai',t.hkEnd+(t.ret?`<span class="block text-[10px] text-orange-600">↩ ${t.redoEnd}</span>`:'')),cell('Waktu bersih',dur(t.hkDur),'text-amber-600'))}
    ${so?`<div class="rounded-xl bg-slate-50 px-3 py-2.5 text-xs text-slate-500"><b class="text-emerald-700">Stayover</b> · otomatis ready saat housekeeper selesai, tanpa cek supervisor.</div>`
      :row('Supervisor'+(r.spvId?' · '+esc(nameOf(r.spvId)):''),'text-violet-700',cell('Mulai cek',t.spvStart+(t.ret&&t.redoSpvStart?`<span class="block text-[10px] text-orange-600">↩ ${t.redoSpvStart}</span>`:'')),cell('Selesai cek',t.spvEnd+(t.ret&&t.redoSpvEnd?`<span class="block text-[10px] text-orange-600">↩ ${t.redoSpvEnd}</span>`:'')),cell('Lama cek',t.spvDur==null?'–':dur(t.spvDur),'text-violet-600'))}
    <div class="grid grid-cols-2 gap-2 text-center">
      <div class="rounded-xl ring-1 ring-inset ring-slate-100 py-2"><p class="text-base font-extrabold text-sky-600">${t.wait==null?'–':dur(t.wait)}</p><p class="text-[10px] text-slate-500">HK selesai → SPV cek</p></div>
      <div class="rounded-xl ring-1 ring-inset ring-brand-100 bg-brand-50/50 py-2"><p class="text-base font-extrabold text-brand-700">${dur(t.total)}</p><p class="text-[10px] text-slate-500">Total HK start → SPV selesai</p></div></div>
    ${t.rework!=null?`<p class="text-xs font-semibold text-orange-700">↩ Dikembalikan SPV (${esc(RETL[r.retReason]||'')}) · putaran pertama ${t.hkStart}–${t.hkEnd} (${dur(t.firstDur)}) · perbaikan ${t.redoStart}–${t.redoEnd} (${dur(t.rework)}). Waktu bersih pengerjaan = jumlah keduanya; waktu menunggu SPV sebelum dikembalikan masuk ke "HK selesai → SPV cek"</p>`:''}
    ${pauseOf(r)?`<p class="text-xs text-orange-700">Jeda (pause) ${mins(pauseOf(r))} menit · tidak dihitung di waktu bersih pengerjaan, tetap masuk ke total</p>`:''}</div>`;
}
function viewRecap(){

  const shown=S.showAll?done:done.slice(0,40);
  return `${pageHead('',`${done.length} kamar ready hari ini`)}<div class="mb-4 sm:w-72">${searchBox('f-rq','Cari nomor kamar')}</div>
  ${done.length?`<div class="grid gap-3 sm:gap-4 md:grid-cols-2 2xl:grid-cols-3">${shown.map(r=>recapCard(r,S.me.role!=='gm')).join('')}</div>${done.length>40?`<div class="text-center mt-4"><button data-act="toggleAll" class="${bc('ghost')}">${S.showAll?'Tampilkan lebih sedikit':`Tampilkan semua (${done.length})`}</button></div>`:''}`
  :card(empty('clock','Belum ada kamar ready','Kamar yang sudah diverifikasi muncul di sini.'))}`;
}

  const done=all.filter(r=>r.status==='COMPLETED').sort(roomSort),co=done.filter(hasSpv),left=all.filter(r=>r.status!=='COMPLETED'&&r.status!=='REFUSED'&&!isSkip(r)).sort(roomSort),refusedL=all.filter(r=>r.status==='REFUSED').sort(roomSort);

  return head+strip+status+`<div class="mb-4">${progressCard(all)}</div><div class="grid grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-4">

/* Laporan tamu menunggu (queue): kamar apa saja, mulai queue → ready, total/rata-rata/terlama */
function queueReport(list,endRef){
  const live=!endRef,now=nowS();
  const W=q=>Math.max(0,((q.readyAt||endRef||now)-q.queuedAt));
  const L=list.slice().sort((a,b)=>a.queuedAt-b.queuedAt),mins_=L.map(q=>mins(W(q)));
  const tot=mins_.reduce((a,b)=>a+b,0),avg=L.length?Math.round(tot/L.length):0,max=L.length?Math.max(...mins_):0,min=L.length?Math.min(...mins_):0,waiting=L.filter(q=>!q.readyAt).length;
  const fastest=L[mins_.indexOf(min)],slowest=L[mins_.indexOf(max)];
  const tile=(l,v,sub,c)=>`<div class="rounded-2xl ring-1 ring-inset ring-slate-200/80 p-3.5"><p class="text-xs font-semibold text-slate-500">${l}</p><p class="text-2xl font-extrabold ${c||'text-slate-900'} mt-1">${v}</p>${sub?`<p class="text-[11px] text-slate-500 mt-0.5">${sub}</p>`:''}</div>`;
  return `<div class="mt-4">${card(`${cardHead(`<span class="inline-flex items-center gap-2">${ic('bell','w-4 h-4 text-rose-600')} Rush</span>`,L.length?`${L.length} kamar Rush · waktu dihitung dari mulai Rush sampai kamar ready`:'Tidak ada kamar Rush pada tanggal ini')}
    ${L.length?`<div class="p-4 sm:p-5 grid grid-cols-2 lg:grid-cols-4 gap-2.5">${tile('Total kamar Rush',L.length,L.map(q=>q.room).join(', '),'text-rose-600')}${tile('Rata-rata tunggu',dur(avg*60000),'per kamar')}${tile('Tunggu tercepat',dur(min*60000),fastest?'kamar '+esc(fastest.room):'','text-emerald-600')}${tile('Tunggu terlama',dur(max*60000),(slowest?'kamar '+esc(slowest.room):'')+(waiting?` · ${waiting} belum ready${live?' (masih menunggu)':' saat hari ditutup'}`:''),'text-rose-600')}</div>
    <div class="hidden md:block overflow-x-auto border-t border-slate-100"><table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-500 bg-slate-50/60"><th class="font-semibold px-5 py-2.5">Kamar</th><th class="font-semibold px-3 py-2.5">Housekeeper</th><th class="font-semibold px-3 py-2.5">Mulai Rush</th><th class="font-semibold px-3 py-2.5">Kamar ready</th><th class="font-semibold px-3 py-2.5 text-right">Waktu tunggu tamu</th><th class="font-semibold px-3 py-2.5">Alasan · oleh</th><th class="font-semibold px-5 py-2.5">Status</th></tr></thead>
      <tbody class="divide-y divide-slate-100">${L.map(q=>`<tr class="hover:bg-slate-50/60"><td class="px-5 py-2.5 font-extrabold text-slate-900">${esc(q.room)}${q.top?' <span class="text-[10px] font-extrabold text-white bg-red-700 rounded px-1 py-0.5">★ TOP</span>':''}</td><td class="px-3 py-2.5 text-slate-700">${esc(q.hk||'–')}</td><td class="px-3 py-2.5 font-mono text-xs">${clk(q.queuedAt)}</td><td class="px-3 py-2.5 font-mono text-xs">${q.readyAt?clk(q.readyAt):'<span class="text-rose-600 font-sans font-semibold">belum ready</span>'}</td><td class="px-3 py-2.5 text-right font-bold ${q.readyAt?'text-slate-900':'text-rose-600'}">${dur(W(q))}${!q.readyAt&&live?' <span class="text-[11px] font-semibold">· masih menunggu</span>':''}</td><td class="px-3 py-2.5 text-slate-600">${esc((q.reason||'Queuing Room')+(q.note?': '+q.note:''))} <span class="text-slate-400">· ${esc(q.by||'–')}</span>}</td><td class="px-5 py-2.5">${q.readyAt?chip('Ready','bg-emerald-50 text-emerald-700 ring-emerald-200','bg-emerald-500'):stChip(q.status)}</td></tr>`).join('')}
      <tr class="bg-slate-50/80 font-bold"><td class="px-5 py-2.5" colspan="4">${L.length} kamar</td><td class="px-3 py-2.5 text-right text-slate-900">rata-rata ${dur(avg*60000)}</td><td colspan="2" class="px-5 py-2.5 text-xs font-semibold text-slate-500">tercepat ${dur(min*60000)} · terlama ${dur(max*60000)}</td></tr></tbody></table></div>
    <div class="md:hidden border-t border-slate-100 divide-y divide-slate-100">${L.map(q=>`<div class="px-4 py-3 flex items-center gap-3"><span class="w-12 text-lg font-extrabold text-slate-900">${esc(q.room)}</span><div class="flex-1 min-w-0 text-xs text-slate-500"><p class="truncate">${q.top?'<b class="text-red-700">★ TOP</b> · ':''}${esc(q.hk||'–')}</p><p>queue ${clk(q.queuedAt)} → ${q.readyAt?'ready '+clk(q.readyAt):'<span class="text-rose-600 font-semibold">belum ready</span>'}</p></div><span class="text-sm font-extrabold ${q.readyAt?'text-slate-900':'text-rose-600'}">${dur(W(q))}</span></div>`).join('')}
      <div class="px-4 py-3 bg-slate-50/80 text-xs font-semibold text-slate-600 flex flex-wrap justify-between gap-1"><span class="text-sm font-bold text-slate-900">${L.length} kamar</span><span>rata-rata ${dur(avg*60000)} · tercepat ${dur(min*60000)} · terlama ${dur(max*60000)}</span></div></div>`:''}`)}</div>`;
}

/* Per supervisor: kamar dicek dari total kamar checkout di lantainya, rata-rata jeda HK selesai → mulai cek, lama cek, status saat ini */
function spvStats(R,live,date){
  const by=usersById(),ids=new Set((S.users||[]).filter(u=>u.role==='supervisor'&&u.active).map(u=>u.id));
  R.forEach(r=>{if(r.spvId&&r.category==='CHECKOUT')ids.add(r.spvId)});
  const co=R.filter(r=>r.category==='CHECKOUT'),avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const covered=f=>spvOfFloor(f,date).length>0;
  return [...ids].map(id=>{
    const u=by[id]||{id,name:nameOf(id),floors:''},fl=floorsOf(u),duty=onDuty(id,date);
    /* lantai yang tidak dipegang supervisor incharge mana pun dialihkan ke semua supervisor incharge */
    const inFl=r=>!fl.length||fl.includes(floorOf(r))||(duty&&!covered(floorOf(r)));
    const extra=fl.length&&duty?[...new Set(co.map(floorOf).filter(f=>f!=='Lain'&&!fl.includes(f)&&!covered(f)))].sort(cmpFloor):[];
    const mine=co.filter(inFl),done=co.filter(r=>r.spvId===id&&r.status==='COMPLETED'&&r.spvStartAt); /* stayover tidak dicek supervisor */
    const checkedMine=done.filter(inFl).length,elsewhere=done.length-checkedMine;
    const byOthers=mine.filter(r=>r.status==='COMPLETED'&&r.spvId&&r.spvId!==id).length;
    const waits=done.filter(r=>r.finishHkAt).map(r=>mins(r.spvStartAt-r.finishHkAt)),checks=done.map(r=>mins(r.finishSpvAt-r.spvStartAt));
    const queue=mine.filter(r=>r.status==='INSPECTION_READY').sort((a,b)=>a.finishHkAt-b.finishHkAt);
    return {u,fl,duty,extra,handle:mine.length,checkedMine,elsewhere,byOthers,checked:done.length,pct:mine.length?Math.round(checkedMine/mine.length*100):0,
      avgWait:avg(waits),maxWait:waits.length?Math.max(...waits):null,avgCheck:avg(checks),
      now:live?R.find(r=>r.status==='INSPECTING'&&r.spvId===id):null,queue:live?queue:[],last:done.length?Math.max(...done.map(r=>r.finishSpvAt)):0,
      left:mine.filter(r=>r.status!=='COMPLETED').length};
  }).sort((a,b)=>(b.duty-a.duty)||b.checked-a.checked||a.u.name.localeCompare(b.u.name));
}

        ${c==='PMR'?btn(r,'PMR','Ubah jam','ghost'):btn(r,'PMR','Ingin dibersihkan (PMR)','success')}${c==='NOSERVICE'?'':btn(r,'NOSERVICE','Tamu menolak (Service Refused)','soft')}${c?`<button data-act="csSet" data-id="${esc(r.room)}" data-res="RESET" class="text-xs font-semibold text-slate-500 hover:text-slate-800 px-2">Batalkan</button>`:''}</div>`:''}</article>`};

/* ================= FRONT OFFICE ================= */
/* Front Office: melihat progress kamar (tanpa mengubah status) dan menandai tamu menunggu (queue) */
const FO_RANK={INSPECTING:0,INSPECTION_READY:1,CLEANING:2,PAUSED:3,PENDING:4,COMPLETED:5,REFUSED:6,SLEEPOUT:7,NOSHOW:8,BYCALL:9}; /* yang paling dekat ready tampil di atas */
function foLine(r){
  const hk=r.assignedTo?esc(nameOf(r.assignedTo)):'';
  if(isDnd(r))return `${esc(dndLbl(r))} sejak ${clk(r.dndAt)}${hk?' · '+hk:''}${r.csResult?' · '+(r.csResult==='PMR'?'PMR '+clk(r.csPmrAt):CSL[r.csResult]):' · belum courtesy'}`;
  if(reqPmrOn(r))return `<b class="text-emerald-700">Request PMR ${reqPmrTxt(r)}</b>${hk?' · '+hk:''}`;
  return {PENDING:hk?'Belum mulai · '+hk:'Belum di-assign',
    CLEANING:`Dibersihkan ${hk} · mulai ${clk(r.startAt)}`,
    PAUSED:`Dijeda sejak ${clk(r.pausedAt)} · ${hk}`,
    INSPECTION_READY:`Selesai dibersihkan ${clk(r.finishHkAt)} · menunggu supervisor`,
    INSPECTING:`Dicek ${esc(nameOf(r.spvId))} sejak ${clk(r.spvStartAt)}`,
    COMPLETED:`<b class="text-emerald-700">Siap check-in</b> sejak ${clk(r.finishSpvAt)}`,
    SLEEPOUT:`<b class="text-slate-700">Sleep Out</b> ${clk(r.skipStayAt)}${hk?' · '+hk:''}`,
    NOSHOW:`<b class="text-slate-700">No Show</b> ${clk(r.skipStayAt)}${hk?' · '+hk:''}`,
    BYCALL:`<b class="text-slate-700">By Call</b> ${clk(r.skipStayAt)}${hk?' · '+hk:''}`,
    REFUSED:`<b class="text-stone-700">Service Refused</b> ${clk(r.refusedAt)}${r.refusedVia==='COURTESY'?' · hasil courtesy':' · dari RA'}${hk?' · '+hk:''}`}[r.status]||'';
}
/* Kamar RA: detail daftar kamar setiap RA. Admin melihat semua; supervisor hanya lantainya */
function viewRA(){
  const mf=myFloors(),q=String(dv('f-raq','')).trim().toLowerCase();
  const R=S.rooms.filter(r=>!mf||onMyFloor(r)),by={};R.forEach(r=>{(by[r.assignedTo||'']=by[r.assignedTo||'']||[]).push(r)});
  const nm=id=>id?nameOf(id):'Belum di-assign';
  let ids=Object.keys(by).sort((a,b)=>(!a)-(!b)||nm(a).localeCompare(nm(b)));
  if(q)ids=ids.filter(id=>nm(id).toLowerCase().includes(q)||by[id].some(r=>String(r.room).toLowerCase().startsWith(q)));
  const info=r=>[esc(r.roomType),r.guest&&isSO(r)?'<span class="font-semibold text-slate-700">'+esc(r.guest)+'</span>':'',r.startAt?'mulai '+clk(firstStart(r))+(r.finishHkAt?' · selesai '+clk(r.finishHkAt):''):'',r.status==='COMPLETED'&&r.finishSpvAt?'ready '+clk(r.finishSpvAt):''].filter(Boolean).join(' · ');

const ROLE_ORDER=['superadmin','admin','supervisor','frontoffice','operator','housekeeper','gm'];
/* hak ubah akun (sama dengan aturan di server) */
function rights(t){
  const u=S.me,self=u.id===t.id,m=['supervisor','housekeeper','frontoffice','operator'].includes(t.role);
  return {name:u.role==='superadmin'||(u.role==='admin'&&(m||self)),username:u.role==='superadmin',
    password:!self&&((u.role==='superadmin'&&t.role!=='superadmin')||(u.role==='admin'&&m)||(u.role==='supervisor'&&t.role==='housekeeper')),
    floors:(u.role==='superadmin'||u.role==='admin')&&t.role==='supervisor',role:u.role==='superadmin'&&!self&&t.role!=='superadmin',active:!self&&((u.role==='superadmin'&&t.role!=='superadmin')||(u.role==='admin'&&m))};
}
function viewUsers(){
  if(!S.allUsers){loadUsers();return skeleton()}

  const counts={};S.allUsers.forEach(u=>counts[u.role]=(counts[u.role]||0)+1);
  const actions=(u,justify)=>{const R=rights(u),canDel=S.me.role==='superadmin'&&u.id!==S.me.id&&u.role!=='superadmin';if(!(R.name||R.username||R.password||R.role||R.active||canDel))return '';
    return `<div class="flex flex-wrap gap-1.5 ${justify}">
    ${R.role?`<select data-urole="${u.id}" aria-label="Role ${esc(u.name)}" class="${selectCls} !py-1.5 !text-xs">${['admin','supervisor','frontoffice','operator','housekeeper','gm'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${ROLE[r].l}</option>`).join('')}</select>`:''}
    ${(R.name||R.username||R.password)?`<button data-act="openEditUser" data-id="${u.id}" class="${bc('ghost','sm')}">${ic(R.name||R.username?'edit':'key','w-3.5 h-3.5')} ${R.name||R.username?'Edit':'Ganti password'}</button>`:''}

    ${canDel?`<button data-act="delUserAsk" data-id="${u.id}" class="${bc('danger','sm')}" title="Hapus akun">${ic('trash','w-3.5 h-3.5')} Hapus</button>`:''}</div>`};
  const status=u=>u.active?chip('Aktif','bg-emerald-50 text-emerald-700 ring-emerald-200','bg-emerald-500'):chip('Nonaktif','bg-slate-100 text-slate-500 ring-slate-200');
  const tabs=[['','Semua',S.allUsers.length]].concat(ROLE_ORDER.filter(r=>counts[r]).map(r=>[r,ROLE[r].l,counts[r]]));
  const you=u=>u.id===S.me.id?' <span class="text-xs text-brand-600">(Anda)</span>':'';
  return `${pageHead('',isSpv?`${S.allUsers.length} housekeeper`:`${S.allUsers.length} akun`)}
  <div class="flex flex-col md:flex-row md:items-center gap-3 mb-4">
    ${isSpv?`<p class="text-sm text-slate-600 flex items-center gap-2">${ic('key','w-4 h-4 text-brand-600')} Supervisor bisa mengganti password housekeeper.</p>`:`<div class="flex gap-1 p-1 rounded-xl bg-slate-200/60 overflow-x-auto no-scrollbar">${tabs.map(([k,l,n])=>`<button data-act="ufilter" data-v="${k}" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${fr===k?'bg-white text-slate-900 shadow-card':'text-slate-600 hover:text-slate-900'}">${l} <span class="text-slate-400">${n}</span></button>`).join('')}</div>`}
    <div class="flex-1 md:max-w-xs md:ml-auto">${searchBox('f-uq','Cari nama atau username')}</div>
    ${isAdmin()?`<button data-act="openAddUser" class="${bc('primary')}">${ic('plus')} Tambah pengguna</button>`:''}</div>
  ${isAdmin()?floorCard():''}
  ${card(list.length?`<div class="hidden md:block overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100 bg-slate-50/60"><th class="font-semibold px-5 py-3">Pengguna</th><th class="font-semibold px-3 py-3">Role</th><th class="font-semibold px-3 py-3">Status</th><th class="px-5 py-3"></th></tr></thead>

        <td class="px-3 py-3">${roleChip(u.role)}${u.role==='supervisor'?`<p class="text-[11px] text-violet-700 font-semibold mt-1">${fmtFloors(floorsOf(u))}</p>`:''}</td><td class="px-3 py-3">${status(u)}</td><td class="px-5 py-3">${actions(u,'justify-end')}</td></tr>`).join('')}</tbody></table></div>

      <div class="flex items-center justify-between gap-2">${status(u)}</div>${actions(u,'')}</div>`).join('')}</div>`
    :empty('users','Tidak ada pengguna yang cocok',''))}`;
}

function floorCard(){
  const spvs=S.allUsers.filter(u=>u.role==='supervisor'&&u.active).sort((a,b)=>a.name.localeCompare(b.name));
  if(!spvs.length)return '';
  if(!S.floorDraft){S.floorDraft={};spvs.forEach(u=>S.floorDraft[u.id]=floorsOf(u))}
  const D=S.floorDraft;spvs.forEach(u=>{if(!D[u.id])D[u.id]=floorsOf(u)});
  /* daftar lantai tetap dari server (sheet Pengaturan), ditambah lantai yang sedang dipilih dan lantai baru yang belum disimpan */
  const set=new Set(S.hotelFloors||[]);(S.rooms||[]).map(floorOf).filter(f=>f!=='Lain').forEach(f=>set.add(f));spvs.forEach(u=>D[u.id].concat(floorsOf(u)).forEach(f=>set.add(f)));(S.extraFloors||[]).forEach(f=>set.add(f));
  const floors=[...set].sort(cmpFloor);
  const roomsOn=f=>(S.rooms||[]).filter(r=>floorOf(r)===f).length;
  const newFloors=floors.filter(f=>!(S.hotelFloors||[]).includes(f));
  const dirty=spvs.some(u=>D[u.id].join(',')!==floorsOf(u).join(','))||newFloors.length>0;
  const anyAll=spvs.some(u=>!D[u.id].length);
  const uncovered=anyAll?[]:floors.filter(f=>!spvs.some(u=>D[u.id].includes(f)));
  const shared=floors.filter(f=>spvs.filter(u=>D[u.id].includes(f)).length>1);
  const row=u=>{const a=D[u.id];return `<div class="min-w-0 rounded-xl ring-1 ring-inset ring-slate-200/80 p-3 space-y-2.5">
    <div class="flex flex-wrap items-center gap-x-3 gap-y-2">${avatar(u.name,'w-8 h-8 text-[10px]')}<div class="flex-1 min-w-0"><p class="text-sm font-semibold text-slate-900 truncate">${esc(u.name)}</p><p class="text-xs ${a.length?'text-violet-700 font-semibold':'text-slate-500'}">${a.length?fmtFloors(a):'Semua lantai (belum dibagi)'}</p></div>
      ${a.length?`<button data-act="flClear" data-id="${u.id}" class="text-xs font-semibold text-slate-500 hover:text-slate-800 px-2 py-1">Kosongkan</button>`:''}${inchargeSwitch(u,S.today)}</div>
    <div class="flex flex-wrap gap-1.5">${floors.length?floors.map(f=>{const on=a.includes(f);return `<button data-act="flTog" data-id="${u.id}" data-f="${esc(f)}" aria-pressed="${on}" class="min-w-[3rem] px-2.5 py-1.5 rounded-lg text-xs font-bold ring-1 ring-inset transition ${on?'bg-violet-600 text-white ring-violet-600 shadow-sm':'bg-white text-slate-600 ring-slate-200 hover:ring-violet-300 hover:text-violet-700'}">Lt ${esc(f)}</button>`}).join(''):'<p class="text-xs text-slate-500">Belum ada kamar hari ini. Tambahkan nomor lantai di bawah.</p>'}</div></div>`};
  return `<div class="mb-4">${inchargeNote(S.today)}${card(`${cardHead('Lantai supervisor · hari ini','Berlaku untuk hari ini saja dan otomatis kosong lagi saat ganti hari. Supervisor hanya menerima notifikasi dari lantai yang dipilih; kosong = semua lantai.',`${ic('layers','w-5 h-5 text-violet-600')}`)}
    <div class="px-4 sm:px-5 pb-4"><div class="grid gap-2.5 lg:grid-cols-2 2xl:grid-cols-3 pt-1">${spvs.map(row).join('')}</div>
      ${uncovered.length?`<div class="mt-2 flex items-start gap-2 rounded-xl bg-rose-50 ring-1 ring-inset ring-rose-200 px-3 py-2.5 text-xs text-rose-800">${ic('alert','w-4 h-4 shrink-0')}<span><b>${fmtFloors(uncovered)}</b> belum punya supervisor. Tidak ada supervisor yang mendapat notifikasi dari lantai ini.</span></div>`:''}
      ${(()=>{const x=S.incharge;if(!x||!x.set)return '';const noDuty=floors.filter(f=>!spvOfFloor(f).length);return noDuty.length?`<div class="mt-2 flex items-start gap-2 rounded-xl bg-amber-50 ring-1 ring-inset ring-amber-200 px-3 py-2.5 text-xs text-amber-900">${ic('alert','w-4 h-4 shrink-0')}<span>Hari ini <b>${fmtFloors(noDuty)}</b> tidak dipegang supervisor incharge, jadi notifikasinya dialihkan ke semua supervisor yang incharge.</span></div>`:''})()}
      ${shared.length?`<p class="mt-2 text-xs text-slate-500">${fmtFloors(shared)} di-handle lebih dari satu supervisor; keduanya mendapat notifikasi.</p>`:''}
      <div class="mt-3 flex flex-col sm:flex-row sm:items-center gap-2">
        <div class="flex gap-2 sm:w-64"><input id="f-flnew" type="text" inputmode="numeric" placeholder="Tambah lantai (mis. 11-14)" aria-label="Tambah lantai" class="${field} !py-2 !text-sm"><button data-act="flAdd" class="${bc('soft','sm')} shrink-0">${ic('plus','w-3.5 h-3.5')}</button></div>
        <p class="text-[11px] text-slate-400 sm:flex-1">${newFloors.length?`<span class="text-amber-700 font-semibold">${fmtFloors(newFloors)} baru, tersimpan saat Simpan.</span> `:''}${(S.rooms||[]).length?floors.filter(roomsOn).map(f=>'Lt '+esc(f)+': '+roomsOn(f)).join(' · ')+' kamar hari ini':''}</p>
        ${dirty?`<button data-act="flReset" class="${bc('ghost','sm')}">Batal</button>`:''}<button data-act="flSave" ${dirty?'':'disabled'} class="${bc('primary','sm')} disabled:opacity-40 disabled:cursor-not-allowed">Simpan pembagian</button></div>

          <div class="flex gap-2"><input id="f-hfloors" type="text" value="${esc(fmtRange(S.hotelFloors||[]))}" placeholder="mis. 2-12" aria-label="Daftar lantai hotel" class="${field} !py-2 !text-sm"><button data-act="saveHotelFloors" class="${bc('dark','sm')} shrink-0">Simpan daftar</button></div></div></details></div>`)}</div>`;
}

function parseRooms(s){
  const out=[];
  for(const part of s.split(/[\s,;]+/)){
    if(!part)continue;const m=part.match(/^(\d{1,5})-(\d{1,5})$/);
    if(m){let a=+m[1],b=+m[2];if(b<a)[a,b]=[b,a];if(b-a>60)return{error:`Rentang ${part} terlalu panjang (maks 60 kamar).`};for(let i=a;i<=b;i++)out.push(String(i))}
    else if(/^[A-Za-z0-9]{1,6}$/.test(part))out.push(part.toUpperCase());
    else return{error:`"${part}" bukan nomor kamar yang valid.`};
  }
  return{rooms:[...new Set(out)]};
}
async function handleFile(f){
  if(!f)return;
  if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf')return toast('Pilih file PDF Task Sheet Report.');
  S.imp={state:'reading',fileName:f.name,pagesDone:0,pagesTotal:0};render();
  let L;try{L=await loadPdfJs()}catch(e){S.imp={state:'error',fileName:f.name,error:'Pembaca PDF gagal dimuat. Periksa koneksi internet lalu coba lagi.'};return render()}
  try{
    const doc=await L.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false,disableFontFace:true}).promise;
    S.imp.pagesTotal=doc.numPages;const pages=[];
    for(let n=1;n<=doc.numPages;n++){
      const p=await doc.getPage(n),vp=p.getViewport({scale:1}),tc=await p.getTextContent();
      pages.push({items:tc.items.map(it=>({x:it.transform[4],y:vp.height-it.transform[5],w:it.width,str:it.str}))});
      S.imp.pagesDone=n;render();
    }
    const parsed=parseTaskSheet(pages);
    if(!parsed.rows.length)throw new Error('Tidak ada baris kamar yang terbaca. Pastikan file ini Task Sheet Report dari Opera.');
    S.imp={state:'preview',fileName:f.name,parsed,date:parsed.date||S.today};delete S.drafts['f-rmmissing'];
    if(S.imp.date!==S.today&&!S.report[S.imp.date])loadReport(S.imp.date);
    render();
  }catch(e){S.imp={state:'error',fileName:f.name,error:(e&&e.message&&!/pdfjs/.test(e.message))?e.message:'File tidak bisa dibaca. Pastikan ini PDF Task Sheet Report lalu coba lagi.'};render()}
}

/* ================= NOTIFIKASI QUEUE ================= */
const qKey=r=>S.today+'|'+r.room+'|'+r.queuedAt;
function seenSet(){try{return new Set(JSON.parse(localStorage.getItem('hk.qseen')||'[]'))}catch(e){return new Set()}}
function markSeen(list){const s=seenSet();list.forEach(r=>s.add(qKey(r)));try{localStorage.setItem('hk.qseen',JSON.stringify([...s].slice(-300)))}catch(e){}S.qSeenMem=s}
/* kamar queue yang masih di tangan RA (belum Finish). Setelah RA Finish, giliran SPV: RA tidak diingatkan lagi */
const withRA=r=>['PENDING','CLEANING','PAUSED'].includes(r.status);
function relevantQueue(){
  if(!S.me)return [];
  if(S.me.role==='housekeeper')return queued().filter(r=>r.assignedTo===S.me.id&&withRA(r));
  if(S.me.role==='supervisor')return meOnDuty()?queued().filter(onMyFloor):[];
  return [];
}
/* Pengingat cek ulang DND / Double Sign untuk RA: tiap 1 jam sejak cek terakhir, berulang tiap jam sampai dicek ulang */
const dndSeen=new Set();
function checkDndAlerts(){
  if(!S.me||S.me.role!=='housekeeper'||!S.loaded)return;
  const fresh=S.rooms.filter(r=>r.assignedTo===S.me.id&&dndLate(r)).filter(r=>{const k=r.room+'|'+(r.dndCheckAt||r.dndAt)+'|'+Math.floor((nowS()-dndDue(r))/3600000);if(dndSeen.has(k))return false;dndSeen.add(k);return true});
  if(!fresh.length)return;
  const h=Math.max(1,Math.floor((nowS()-Math.min(...fresh.map(r=>r.dndCheckAt||r.dndAt)))/3600000));
  const t='Waktunya cek ulang kamar '+fresh.map(r=>r.room).join(', '),m=`Sudah ${h} jam sejak dicek. Cek apakah sign ${[...new Set(fresh.map(dndLbl))].join(' / ')} sudah hilang.`;
  notify('alarm',t,m,'dnd');toast(t+' · '+m);render();
}
/* Pengingat tamu menunggu (queue): RA pemegang kamar & supervisor incharge di lantainya, setiap 10 menit sampai kamar ready */
/* RA: pengingat PMR saat jam yang diminta tamu tiba, lalu tiap 10 menit sampai Start. Operator: kamar yang belum di-courtesy tiap 15 menit */
const pmrSeen=new Set(),csSeen=new Set();
function checkCourtesyReminders(){
  if(!S.me||!S.loaded)return;const now=nowS();
  if(S.me.role==='housekeeper'){
    const due=S.rooms.filter(r=>r.assignedTo===S.me.id&&(pmrDue(r)||reqPmrDue(r))).filter(r=>{const at=reqPmrOn(r)?r.reqPmrAt:r.csPmrAt;const k=r.room+'|'+at+'|'+Math.floor((now-at)/600000);if(pmrSeen.has(k))return false;pmrSeen.add(k);return true});
    if(due.length){const t=`Waktunya membersihkan kamar ${due.map(r=>r.room).join(', ')}`,m='Permintaan tamu (PMR). Tekan Start saat mulai.';notify('alarm',t,m,'pmr');toast(t+' · '+m);render()}
  }
  if(S.me.role==='operator'){
    const need=S.rooms.filter(r=>isDnd(r)&&!r.csResult&&now-r.dndAt>=900000).filter(r=>{const k=r.room+'|'+r.dndAt+'|'+Math.floor((now-r.dndAt)/900000);if(csSeen.has(k))return false;csSeen.add(k);return true});
    if(need.length){const t=`Belum di-courtesy: kamar ${need.map(r=>r.room).join(', ')}`;notify('alarm',t,'Hubungi tamu lalu update statusnya.','courtesy');toast(t)}
  }
}
const QUEUE_REMIND_MS=600000,qRemindSeen=new Set();
function checkQueueReminders(){
  if(!S.me||!S.loaded)return;
  const role=S.me.role;let list=[];
  if(role==='housekeeper')list=queued().filter(r=>r.assignedTo===S.me.id&&withRA(r));
  else if(role==='supervisor')list=meOnDuty()?queued().filter(onMyFloor):[];
  else return;
  const now=nowS();
  const fresh=list.filter(r=>r.status!=='COMPLETED'&&r.queuedAt).filter(r=>{const k=Math.floor((now-r.queuedAt)/QUEUE_REMIND_MS);if(k<1)return false;const key=r.room+'|'+r.queuedAt+'|'+k;if(qRemindSeen.has(key))return false;qRemindSeen.add(key);return true});
  if(!fresh.length)return;
  const longest=Math.max(...fresh.map(r=>mins(now-r.queuedAt)));
  const t=`${fresh.some(isTop)?'★ TOP PRIORITY · ':''}Tamu masih menunggu: kamar ${fresh.map(r=>(isTop(r)?'★':'')+r.room).join(', ')}`;
  const m=fresh.length===1?`Sudah ${longest} menit. Status: ${isDnd(fresh[0])?dndLbl(fresh[0]):ST[fresh[0].status].l}.${role==='housekeeper'?' Kerjakan lebih dulu.':' Segera cek.'}`:`Terlama ${longest} menit.${role==='housekeeper'?' Kerjakan lebih dulu.':' Segera cek.'}`;
  notify('alarm',t,m,'queue-remind');toast(t+' · '+m);
}
function checkQueueAlerts(){
  const rel=relevantQueue();if(!rel.length)return;
  const seen=S.qSeenMem||seenSet();
  const fresh=rel.filter(r=>!seen.has(qKey(r)));
  if(!fresh.length)return;
  S.qAlert=rel;
  notify('alarm',(fresh.some(isTop)?'★ TOP PRIORITY · ':'')+'Rush · '+[...new Set(fresh.map(rushLbl))].join(', '),'Kamar '+fresh.map(r=>r.room).join(', ')+(S.me.role==='housekeeper'?' — kerjakan lebih dulu':' — segera cek'),'queue');
}

/* ================= BUNYI & NOTIFIKASI ================= */
/* Browser hanya mengizinkan bunyi setelah layar disentuh sekali. Banner "Aktifkan bunyi" muncul sampai itu terjadi. */
let actx=null,swReg=null,wakeLock=null;
const audioOn=()=>!!(actx&&actx.state==='running');
/* jangan render ulang seluruh halaman di sini: ketukan pertama bisa hilang jika tombol diganti di tengah klik */
function updateAudioUi(){const b=document.getElementById('audio-banner');if(b)b.hidden=!S.soundOn||audioOn();document.querySelectorAll('[data-bell]').forEach(el=>el.classList.toggle('text-brand-700',S.soundOn&&audioOn()))}
function unlockAudio(){
  try{
    if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C){actx=new C();actx.onstatechange=updateAudioUi}}
    if(actx&&actx.state!=='running')actx.resume().then(updateAudioUi).catch(()=>{});
  }catch(e){}
}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('keydown',unlockAudio);
function playSound(kind){
  if(!S.soundOn||!audioOn())return;
  const seq=kind==='alarm'?[[880,0],[660,.2],[880,.4],[660,.6],[988,.8],[1175,1.0]]:kind==='test'?[[659,0],[880,.16],[1047,.32]]:[[784,0],[1047,.16]];
  try{const t=actx.currentTime;seq.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=kind==='alarm'?'square':'sine';o.frequency.value=f;
    const peak=kind==='alarm'?0.22:0.35;g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(peak,t+d+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+.18);
    o.connect(g);g.connect(actx.destination);o.start(t+d);o.stop(t+d+.2)})}catch(e){}
}
function sysNotify(title,body,tag){
  if(!document.hidden||!('Notification' in window)||Notification.permission!=='granted')return;
  const opt={body:body||'',tag:tag||'hk',renotify:true,icon:'icon-192.png',badge:'icon-192.png',vibrate:[300,150,300]};
  try{if(swReg&&swReg.showNotification)swReg.showNotification(title,opt);else new Notification(title,opt)}catch(e){}
}
function notify(kind,title,body,tag){
  playSound(kind);
  try{navigator.vibrate&&navigator.vibrate(kind==='alarm'?[400,150,400,150,600]:[200,100,200])}catch(e){}
  if(kind!=='alarm')toast(title+(body?' · '+body:''));
  sysNotify(title,body,tag);
}
const canSysNotify=()=>!!window.HK_API_URL&&('Notification' in window);
async function enableAlerts(){
  unlockAudio();S.soundOn=true;lsSet('hk.sound','1',true);
  setTimeout(()=>playSound('test'),150);
  if(canSysNotify()&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}
  render();
}
async function applyWake(){
  try{
    if(S.wake&&!document.hidden&&'wakeLock' in navigator){if(!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}
    else if(wakeLock){await wakeLock.release();wakeLock=null}
  }catch(e){}
}
if(window.HK_API_URL&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{})}
/* kejadian baru sejak pembaruan terakhir → bunyi */
function detectEvents(prev,next){
  if(!prev||!S.me)return;
  const P=new Map(prev.map(r=>[r.room,r])),me=S.me;
  if(me.role==='housekeeper'){
    const added=next.filter(r=>r.assignedTo===me.id&&r.status!=='COMPLETED'&&!(P.get(r.room)&&P.get(r.room).assignedTo===me.id));
    if(added.length)notify(added.some(isQ)?'alarm':'info',added.length===1?'Kamar baru: '+added[0].room+(isQ(added[0])?' (Rush)':''):added.length+' kamar baru untuk Anda',added.length>1?added.slice(0,8).map(r=>r.room).join(', '):'Dialihkan oleh admin/supervisor','assign');
    /* HP RA hanya menerima kamar miliknya: kamar yang tadinya milik saya (belum dimulai) dan kini hilang = dialihkan ke RA lain */
    const N=new Map(next.map(r=>[r.room,r]));
    const gone=prev.filter(p=>p.assignedTo===me.id&&p.status==='PENDING'&&!(N.get(p.room)&&N.get(p.room).assignedTo===me.id));
    if(gone.length)notify('info',`Kamar ${gone.map(r=>r.room).join(', ')} dialihkan ke RA lain`,'Tidak perlu dikerjakan lagi. Diatur oleh admin/supervisor.','assign');
  }
  if(me.role==='supervisor'&&meOnDuty()){ /* Second Call di lantai supervisor */
    const cs=next.filter(r=>onMyFloor(r)&&reqPmrOn(r)&&P.get(r.room)&&calls(r)>=2&&calls(r)>calls(P.get(r.room)));
    cs.forEach(r=>notify('alarm',`Call ke-${calls(r)} kamar ${r.room}`,`Tamu menelepon lagi · RA ${nameOf(r.assignedTo)} belum datang`,'pmr'));
  }
  if(['superadmin','admin','frontoffice'].includes(me.role)){ /* notes yang saya kirim sudah dikerjakan RA */
    next.forEach(r=>{const P0=P.get(r.room);if(!P0)return;const was=new Map(gnotes(P0).map(n=>[n.id,n.doneAt]));gnotes(r).filter(n=>n.by===me.id&&n.doneAt&&was.has(n.id)&&!was.get(n.id)).forEach(n=>notify('info',`Notes kamar ${r.room} sudah dikerjakan`,n.t+' · '+(n.dn||nameOf(n.doneBy)),'assign'))});
  }
  if(me.role==='housekeeper'){
    const pm=next.filter(r=>r.assignedTo===me.id&&isDnd(r)&&r.csResult==='PMR'&&P.get(r.room)&&(P.get(r.room).csResult!=='PMR'||P.get(r.room).csPmrAt!==r.csPmrAt));
    pm.forEach(r=>{const t=`Kamar ${r.room}: tamu minta dibersihkan ${pmrTxt(r)}`;notify(nowS()>=r.csPmrAt?'alarm':'info',t,r.csNote||'Info dari operator','pmr');if(nowS()>=r.csPmrAt){toast(t);pmrSeen.add(r.room+'|'+r.csPmrAt+'|'+Math.floor((nowS()-r.csPmrAt)/600000))}});
    const rq=next.filter(r=>r.assignedTo===me.id&&reqPmrOn(r)&&P.get(r.room)&&P.get(r.room).reqPmrAt!==r.reqPmrAt&&r.reqPmrBy!==me.id&&!(calls(r)>=2&&calls(r)>calls(P.get(r.room))));
    rq.forEach(r=>{const t=`Request PMR kamar ${r.room}: dibersihkan ${reqPmrTxt(r)}`;const due=nowS()>=r.reqPmrAt;notify(due?'alarm':'info',t,r.reqPmrNote||'Permintaan tamu stayover','pmr');if(due){toast(t);pmrSeen.add(r.room+'|'+r.reqPmrAt+'|'+Math.floor((nowS()-r.reqPmrAt)/600000))}});
    const rt=next.filter(r=>r.assignedTo===me.id&&r.retAt&&P.get(r.room)&&P.get(r.room).retAt!==r.retAt);
    rt.forEach(r=>{const t=`Kamar ${r.room} dikembalikan oleh SPV (${(RETL[r.retReason]||'').toLowerCase()})`;notify('alarm',t,(r.retNote?'"'+r.retNote+'" · ':'')+nameOf(r.retBy)+' · perbaiki lalu Finish lagi','assign');toast(t)});
    const ns=next.filter(r=>r.assignedTo===me.id&&r.status==='REFUSED'&&r.refusedVia==='COURTESY'&&P.get(r.room)&&P.get(r.room).status!=='REFUSED');
    const nn=next.filter(r=>r.assignedTo===me.id&&P.get(r.room)).flatMap(r=>{const old=new Set(gnotes(P.get(r.room)).map(n=>n.id));return openNotes(r).filter(n=>!old.has(n.id)).map(n=>[r,n])});
    nn.forEach(([r,n])=>{const t=`Notes kamar ${r.room}: ${n.t}`;notify('alarm',t,'Dari '+(n.bn||nameOf(n.by))+' · tekan Sudah setelah dikerjakan','pmr');toast(t)});
    const cl=next.filter(r=>r.assignedTo===me.id&&reqPmrOn(r)&&P.get(r.room)&&calls(r)>=2&&calls(r)>calls(P.get(r.room)));
    cl.forEach(r=>{const t=`Call ke-${calls(r)} kamar ${r.room}: tamu menelepon lagi`;notify('alarm',t,'Request PMR · segera ke kamar','pmr');toast(t)});
    const cof=next.filter(r=>r.assignedTo===me.id&&r.coAt&&P.get(r.room)&&!P.get(r.room).coAt);
    cof.forEach(r=>{const t=`Kamar ${r.room}: ${coLbl(r)} · sekarang checkout`;notify('alarm',t,r.status==='INSPECTION_READY'?'Sudah dibersihkan; supervisor akan mengecek.':'Bersihkan sebagai kamar checkout, lalu dicek supervisor.','assign');toast(t)});
    const sk=next.filter(r=>r.assignedTo===me.id&&isSkip(r)&&r.skipStayBy&&r.skipStayBy!==me.id&&P.get(r.room)&&P.get(r.room).status!==r.status);
    sk.forEach(r=>notify('info',`Kamar ${r.room}: ${skLbl(r)}`,`Ditandai ${nameOf(r.skipStayBy)} · tidak perlu dibersihkan hari ini.`,'assign'));
    const back=next.filter(r=>r.assignedTo===me.id&&r.status==='PENDING'&&!reqPmrOn(r)&&P.get(r.room)&&isSkip(P.get(r.room))&&r.updatedBy!==me.id);
    if(back.length)notify('info',`Kamar ${back.map(r=>r.room).join(', ')} kembali ke daftar`,'Status Sleep Out / No Show / By Call dibatalkan admin. Kamar perlu dibersihkan.','assign');
    if(ns.length)notify('info',`Kamar ${ns.map(r=>r.room).join(', ')}: Service Refused`,'Hasil courtesy operator: tamu menolak dibersihkan. Tidak perlu cek ulang.','pmr');
  }
  { /* kamar dinaikkan ke Top Priority → RA pemegang & supervisor lantainya */
    const up=next.filter(r=>isTop(r)&&P.get(r.room)&&!isTop(P.get(r.room))&&isQ(P.get(r.room)))
      .filter(r=>me.role==='housekeeper'?r.assignedTo===me.id&&withRA(r):me.role==='supervisor'?meOnDuty()&&onMyFloor(r):false);
    if(up.length){const t=`★ TOP PRIORITY: kamar ${up.map(r=>r.room).join(', ')}`;notify('alarm',t,me.role==='housekeeper'?'Kerjakan paling dulu.':'Cek paling dulu.','queue');toast(t)}
  }
  if(me.role==='operator'){
    const nw=next.filter(r=>isDnd(r)&&!r.csResult&&!(P.get(r.room)&&isDnd(P.get(r.room))));
    if(nw.length){const t=`Perlu courtesy: kamar ${nw.map(r=>r.room).join(', ')}`;notify('alarm',t,[...new Set(nw.map(dndLbl))].join(' / ')+' · hubungi tamu','courtesy');toast(t)}
  }
  if(me.role==='supervisor'&&meOnDuty()){
    const ready=next.filter(r=>r.status==='INSPECTION_READY'&&r.category==='CHECKOUT'&&onMyFloor(r)&&P.get(r.room)&&P.get(r.room).status!=='INSPECTION_READY');
    if(ready.length)notify('info',ready.length===1?'Kamar '+ready[0].room+' siap dicek':ready.length+' kamar siap dicek',ready.slice(0,6).map(r=>r.room+' ('+nameOf(r.assignedTo)+')').join(', '),'inspect');
  }
  if(isAdmin()||me.role==='frontoffice'){
    const done=next.filter(r=>r.status==='COMPLETED'&&r.queuedAt&&P.get(r.room)&&P.get(r.room).status!=='COMPLETED');
    if(done.length)notify('info','Kamar '+done.map(r=>r.room).join(', ')+' ready','Tamu yang menunggu sudah bisa masuk','qready');
  }
}

/* ================= RENDER + EVENTS ================= */
let rq=0;
function render(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;doRender()})}
function doRender(){
  const a=document.activeElement,fid=a&&a.id;let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  /* isi kolom password & username tidak disimpan di state: simpan dulu agar tidak hilang saat tampilan digambar ulang */
  const typed={};document.querySelectorAll('input[type=password][id],#l-user').forEach(el=>{if(el.value)typed[el.id]=el.value});
  const app=document.getElementById('app');
  if(!S.token||!S.me)app.innerHTML=S.token&&!S.me?`<div class="min-h-screen flex items-center justify-center"><span class="text-brand-600">${ic('refresh','w-6 h-6 spin')}</span></div>`:viewLogin();
  else if(S.me.mustChange)app.innerHTML=viewMustChange();
  else app.innerHTML=viewShell();
  renderModals();
  for(const id in typed){const el=document.getElementById(id);if(el&&!el.value)el.value=typed[id]}
  if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
}
document.addEventListener('submit',e=>{if(e.target.id==='login-form')submitLogin(e);else if(e.target.id==='pw-form')submitPw(e)});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.hasAttribute('data-overlay')&&e.target.closest('[data-stop]'))return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el)}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.raid!==undefined){S.raOpen=S.raOpen||{};S.raOpen[d.dataset.raid]=d.open}},true);
document.addEventListener('input',e=>{const el=e.target;if(el.hasAttribute('data-keep')){S.drafts[el.id]=el.type==='checkbox'?el.checked:el.value;if(el.hasAttribute('data-live')){S.showAll=false;render()}}});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.hasAttribute('data-keep'))S.drafts[el.id]=el.type==='checkbox'?el.checked:el.value;
  if(el.hasAttribute('data-rerender')){S.showAll=false;render()}
  else if(el.hasAttribute('data-urolepick')){S.drafts['f-urole']=el.value;render()}
  else if(el.dataset.incharge){const id=el.dataset.incharge,x=S.incharge;const base=x&&x.set?x.ids.slice():(S.users||[]).filter(u=>u.role==='supervisor'&&u.active).map(u=>u.id);
    const ids=el.checked?[...new Set(base.concat(id))]:base.filter(v=>v!==id);
    const r=await run(()=>api('setIncharge',S.today,ids),()=>`${nameOf(id)} ${el.checked?'incharge':'tidak incharge'} hari ini.`);if(r)S.incharge=r;render()}
  else if(el.hasAttribute('data-unrpick')){if(S.unreach){S.unreach.reason=el.value;render()}}
  else if(el.hasAttribute('data-pmrmode')){if(S.pmr){S.pmr.mode=el.value;render()}}
  else if(el.hasAttribute('data-skippick')){if(S.skip){S.skip.reason=el.value;render()}}
  else if(el.hasAttribute('data-impmap')){if(S.imp){const m=S.imp.map=S.imp.map||{};if(el.value)m[el.dataset.impmap]=el.value;else delete m[el.dataset.impmap];render()}}
  else if(el.hasAttribute('data-retpick')){if(S.ret){S.ret.reason=el.value;S.ret.note=(document.getElementById('ret-note')||{}).value||'';render()}}
  else if(el.id==='f-pdf'){handleFile(el.files&&el.files[0]);el.value=''}
  else if(el.dataset.queue&&el.checked){el.checked=false;S.rush={room:el.dataset.queue,reason:'',note:''};render()}
  else if(el.id==='note-t'){if(S.note)S.note.t=el.value}
  else if(el.hasAttribute('data-copick')){if(S.co){S.co.note=(document.getElementById('co-note')||{}).value||S.co.note||'';S.co.reason=el.value;render();setTimeout(()=>{const i=document.getElementById('co-note');i&&i.focus()},60)}}
  else if(el.hasAttribute('data-mnmode')){if(S.manual){const g=id=>(document.getElementById(id)||{}).value||'';Object.assign(S.manual,{hk:g('mn-hk'),start:g('mn-start'),finish:g('mn-finish'),mode:el.value});render()}}
  else if(el.hasAttribute('data-rushpurp')){if(S.rush){S.rush.note=(document.getElementById('rush-note')||{}).value||S.rush.note||'';S.rush.purpose=el.value;render();if(el.value!=='VIP')setTimeout(()=>{const i=document.getElementById('rush-note');i&&i.focus()},60)}}
  else if(el.hasAttribute('data-rushpick')){if(S.rush){S.rush.note=(document.getElementById('rush-note')||{}).value||S.rush.note||'';S.rush.reason=el.value;if(el.value!=='PRIORITY')S.rush.purpose='';render();if(el.value==='OTHER')setTimeout(()=>{const i=document.getElementById('rush-note');i&&i.focus()},60)}}
  else if(el.dataset.queue){const room=el.dataset.queue,on=el.checked,r0=S.rooms.find(x=>x.room===room);
    const upd=await run(()=>api('setQueue',S.today,room,on),()=>on?`Kamar ${room}: tamu menunggu. ${r0&&r0.assignedTo?nameOf(r0.assignedTo)+' & supervisor diberi tahu.':'Kamar ini belum di-assign!'}`:`Rush kamar ${room} dibatalkan`);
    if(upd){const i=S.rooms.findIndex(x=>x.room===upd.room);if(i>=0)S.rooms[i]=upd}render()}
  else if(el.dataset.reassign){const room=el.dataset.reassign,to=el.value;const r=await run(()=>api('assignRooms',S.today,[[room,to]]),'Kamar '+room+' → '+nameOf(to));if(r){S.rooms=r.rooms;render()}}
  else if(el.dataset.pref==='sound'){if(el.checked){enableAlerts()}else{S.soundOn=false;lsSet('hk.sound','0',true);render()}}
  else if(el.dataset.pref==='wake'){S.wake=el.checked;lsSet('hk.wake',el.checked?'1':'0',true);applyWake();toast(el.checked?'Layar akan tetap menyala selama aplikasi terbuka':'Layar boleh mati otomatis');render()}
  else if(el.dataset.urole){await run(()=>api('saveUser',{id:el.dataset.urole,role:el.value}),'Role diperbarui');S.allUsers=null;render()}
  else if(el.dataset.pick&&S.modal){el.checked?S.modal.sel.add(el.dataset.pick):S.modal.sel.delete(el.dataset.pick)}
  else if(el.id==='f-sdate'&&el.value){S.spvDate=el.value;if(el.value!==S.today&&!S.report[el.value])loadReport(el.value);render()}
  else if(el.id==='f-rdate'&&el.value){S.reportDate=el.value;if(el.value!==S.today&&!S.report[el.value])loadReport(el.value);render()}
  else if(el.id==='f-impdate'&&el.value&&S.imp){S.imp.date=el.value;if(el.value!==S.today&&!S.report[el.value])loadReport(el.value);render()}
});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('!border-brand-500','!bg-brand-50')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('!border-brand-500','!bg-brand-50')});
document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('#drop')){e.preventDefault();handleFile(e.dataTransfer.files&&e.dataTransfer.files[0])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.modal||S.confirm||S.acct||S.more||S.addUser||S.qAlert||S.editUser)){if(S.qAlert)markSeen(S.qAlert);Object.assign(S,{modal:null,confirm:null,acct:false,more:false,addUser:false,qAlert:null,editUser:null});render()}});
/* gambar ulang hanya jika LEBAR layar berubah (rotasi / jendela). Keyboard HP hanya mengubah tinggi; menggambar ulang saat itu menutup keyboard lagi */
let rsT,rsW=window.innerWidth;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(window.innerWidth===rsW)return;rsW=window.innerWidth;render()},200)});
document.addEventListener('visibilitychange',()=>{applyWake();if(!document.hidden)checkUpdate();if(!document.hidden&&S.me&&nowS()-S.lastSync>10000)refresh(true)});
setInterval(()=>{document.querySelectorAll('[data-dnd]').forEach(el=>{el.textContent='· '+dndLeftAt(+el.dataset.dnd)});document.querySelectorAll('[data-since]').forEach(el=>{const s=+el.dataset.since;if(s)el.textContent=timer(nowS()-s)});const c=fmtClock();document.querySelectorAll('[data-clock]').forEach(el=>el.textContent=c);document.querySelectorAll('[data-wait]').forEach(el=>{const s=+el.dataset.wait;if(s)el.textContent='hm' in el.dataset?hmTxt(mins(nowS()-s)):mins(nowS()-s)})},1000);
/* sinkron jam server saat dibuka & tiap 10 menit (juga di halaman login) */
async function syncServerTime(){try{const t0=Date.now();const r=await call('getServerTime',[]);syncClock(r.now,t0,Date.now())}catch(e){}}
syncServerTime();setInterval(syncServerTime,600000);
/* refresh: tiap 20 detik, atau 10 detik selama ada tamu menunggu */
setInterval(()=>{checkUpdate();checkDndAlerts();checkQueueReminders();checkCourtesyReminders();if(!S.me||S.me.mustChange||S.busy||S.modal||S.confirm||S.addUser||S.editUser||S.skip||S.rush||S.co||S.note||S.move||S.pmr||S.unreach||S.closing||S.ret||S.manual||(S.imp&&S.imp.state==='writing'))return;const every=document.hidden?30000:queued().length?6000:10000;if(nowS()-S.lastSync>=every&&!refreshing)refresh(true)},2500);

(async function boot(){
  render();
  if(!S.token)return;
  try{const r=await call('whoAmI',[S.token]);S.me=r.me;S.today=r.today;S.view=defaultView();render();refresh();applyWake()}
  catch(e){if(e.code==='AUTH')doLocalLogout('');else{S.token='';S.me=null;S.loginErr=e.message;render()}}
})();
</script>
