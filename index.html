    window.HK_API_URL = 'https://script.google.com/macros/s/AKfycbyyFZ7k-3dElnTu4hKc6IbNF9uVi5FnZiOTJ6N4Wszv9jNoRZQYKMee7GVqjIfr-QEaRA/exec';
    /* Pengganti google.script.run: memanggil server lewat POST {fn, args} */
    (function () {
      function runner() {
        var ok = function () {}, bad = function () {};
        var p = new Proxy({}, { get: function (t, k) {
          if (k === 'withSuccessHandler') return function (f) { ok = f; return p; };
          if (k === 'withFailureHandler') return function (f) { bad = f; return p; };
          return function () {
            var args = Array.prototype.slice.call(arguments);
            fetch(window.HK_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: k, args: args }), redirect: 'follow' })
              .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
              .then(function (j) { j.ok ? ok(j.result) : bad(new Error(j.error)); })
              .catch(function (e) { var m = String((e && e.message) || e); bad(new Error(/Failed to fetch|NetworkError|Load failed/i.test(m) ? 'network' : m)); });
          };
        } });
        return p;
      }
      window.google = { script: { get run() { return runner(); } } };
    })();
  </script>

const ic=(n,c='w-4 h-4')=>`<svg viewBox="0 0 24 24" class="${c} shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`;

/* ---------------- HELPERS ---------------- */
const pad=n=>String(n).padStart(2,'0');
/* Jam HP bisa selisih beberapa menit dari server; timer memakai jam server (S.skew = server - HP). */
const nowS=()=>Date.now()+((typeof S!=='undefined'&&S.skew)||0);
function syncClock(serverMs,t0,t1){if(serverMs&&t1-t0<5000){S.skew=serverMs-Math.round((t0+t1)/2);S.clockSynced=true}}
const fmtClock=()=>new Date(nowS()).toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).replace(/:/g,'.');
const serverClock=(cls='inline-flex')=>`<span class="items-center gap-1.5 ${cls}" title="${(typeof S!=='undefined'&&S.clockSynced)?'Jam server (WIB)':'Menyamakan dengan jam server…'}">${ic('clock','w-3.5 h-3.5')}<span data-clock class="font-mono font-bold tabular-nums">${fmtClock()}</span><span class="opacity-70">WIB</span></span>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clk=ms=>{if(!ms)return '--.--';return new Date(ms).toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hour12:false}).replace(':','.')};
const mins=ms=>Math.max(0,Math.round((ms||0)/60000));
const timer=ms=>{const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):m)+':'+pad(x)};
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function lsGet(k){try{return localStorage.getItem(k)||sessionStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v,persist){try{(persist?localStorage:sessionStorage).setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(e){}}
const fmtDate=k=>{if(!k)return '';const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};
const fmtShort=k=>{if(!k)return '';const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})};
const fmtDT=ms=>ms?new Date(ms).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const floorOf=r=>{const s=String(r.room||r);return /^\d{3,5}$/.test(s)?s.slice(0,-2):'Lain'};
const greet=()=>{const h=new Date().getHours();return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'};

const ST={
  PENDING:{l:'Belum mulai',chip:'bg-slate-100 text-slate-700 ring-slate-200',dot:'bg-slate-400',tile:'bg-white text-slate-600 ring-slate-300'},
  CLEANING:{l:'Dibersihkan',chip:'bg-amber-50 text-amber-800 ring-amber-200',dot:'bg-amber-500',tile:'bg-amber-400 text-amber-950 ring-amber-500'},
  PAUSED:{l:'Jeda',chip:'bg-orange-50 text-orange-800 ring-orange-200',dot:'bg-orange-500',tile:'bg-orange-200 text-orange-900 ring-orange-300'},

};

const catOf=c=>CAT[c]||CAT.CHECKOUT;
const ROLE={superadmin:{l:'PENGUASA',chip:'bg-fuchsia-50 text-fuchsia-700 ring-fuchsia-200'},admin:{l:'Admin',chip:'bg-brand-50 text-brand-700 ring-brand-200'},supervisor:{l:'Supervisor',chip:'bg-amber-50 text-amber-800 ring-amber-200'},housekeeper:{l:'Housekeeper',chip:'bg-sky-50 text-sky-700 ring-sky-200'}};
const ORDER={CLEANING:0,PAUSED:1,PENDING:2,INSPECTION_READY:3,COMPLETED:4};

const S={persist:(()=>{try{return !!localStorage.getItem('hk.token')}catch(e){return false}})(),token:lsGet('hk.token'),me:null,today:'',rooms:[],users:[],uploads:[],loaded:false,view:'',
  reportDate:'',report:{},allUsers:null,log:null,storage:null,drafts:{},del:'',modal:null,confirm:null,creds:null,acct:false,more:false,addUser:false,imp:null,
  showAll:false,busy:0,lastSync:0,loginErr:'',syncErr:'',qAlert:null,editUser:null};

/* ---------------- SERVER CALLS ---------------- */
function call(fn,args){
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(res).withFailureHandler(e=>{
      const m=String((e&&e.message)||e||'Gagal');const i=m.indexOf('|');
      rej(i>0&&/^[A-Z]+$/.test(m.slice(0,i))?{code:m.slice(0,i),message:m.slice(i+1)}:{code:'ERR',message:/network|NetworkError|failed to fetch/i.test(m)?'Koneksi terputus. Periksa internet lalu coba lagi.':m});
    })[fn].apply(null,args);
  });
}
async function api(fn,...args){
  S.busy++;renderBusy();
  try{return await call(fn,[S.token].concat(args))}
  catch(e){
    if(e.code==='AUTH'){doLocalLogout(e.message);throw e}
    if(e.code==='MUSTCHANGE'){if(S.me)S.me.mustChange=true;render();throw e}
    throw e;
  }finally{S.busy--;renderBusy()}
}
async function run(fn,ok){try{const r=await fn();if(ok)toast(typeof ok==='function'?ok(r):ok);return r}catch(e){if(e.code!=='AUTH'&&e.code!=='MUSTCHANGE')toast(e.message||'Gagal.');return null}}
let toastT;function toast(m){const el=document.getElementById('toast');document.getElementById('toast-msg').textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3500)}
function renderBusy(){document.querySelectorAll('[data-busy]').forEach(el=>el.classList.toggle('spin',!!S.busy))}

async function refresh(silent){
  if(!S.token||!S.me||S.me.mustChange)return;
  try{
    const t0=Date.now();const st=await api('getState',S.today||'');syncClock(st.serverTime,t0,Date.now());
    S.me=st.me;S.rooms=st.rooms;S.users=st.users;S.uploads=st.uploads||[];S.loaded=true;S.lastSync=nowS();S.syncErr='';
    S.today=st.today;if(!S.reportDate)S.reportDate=st.today;
    checkQueueAlerts();
    render();
  }catch(e){if(e.code!=='AUTH'&&e.code!=='MUSTCHANGE'){S.syncErr=e.message;if(!silent)toast(e.message);render()}}
}
async function loadReport(date){const st=await run(()=>api('getState',date));if(st){S.report[date]=st.rooms;render()}}
function doLocalLogout(msg){
  lsDel('hk.token');Object.assign(S,{token:'',me:null,loaded:false,rooms:[],users:[],allUsers:null,log:null,modal:null,confirm:null,creds:null,acct:false,more:false,addUser:false,imp:null,qAlert:null,loginErr:msg||'',view:''});
  render();
}

/* ---------------- PDF TASK SHEET PARSER (Opera hsk_tasksheet) ---------------- */
function parseTaskSheet(pages){
  const COLS=[['flag',0,20],['room',20,45],['type',45,70],['rs',70,95],['fo',95,120],['am',120,140],['pm',140,165],['resv',165,240],['next',240,282],['td',282,297],['title',297,335],['name',335,385],['arr',385,428],['arrt',428,468],['dep',468,505],['dept',505,545],['vip',545,562],['adl',562,578],['chl',578,598],['spec',598,660],['instr',660,1e9]];
  const colOf=x=>{for(const c of COLS)if(x>=c[1]&&x<c[2])return c[0]};
  let date='',att='',seq=0;const rows=[],warnings=[];
  for(const pg of pages){
    const words=[];
    for(const it of pg.items){
      const s=it.str;if(!s||!s.trim())continue;const L=s.length;let i=0;
      for(const part of s.split(/(\s+)/)){if(part.trim())words.push({x:it.x+(L?it.w*i/L:0),y:it.y,t:part});i+=part.length}
    }
    words.sort((a,b)=>a.y-b.y||a.x-b.x);
    const lines=[];
    for(const w of words){const l=lines[lines.length-1];if(l&&w.y-l.y<=1.6)l.ws.push(w);else lines.push({y:w.y,ws:[w]})}
    let inRows=false,cur=null;
    for(const l of lines){
      l.ws.sort((a,b)=>a.x-b.x);
      const txt=l.ws.map(w=>w.t).join(' ');
      if(!date){const m=txt.match(/Task Date From\s+(\d{2})\/(\d{2})\/(\d{2})/);if(m)date='20'+m[3]+'-'+m[2]+'-'+m[1]}
      if(/^Instructions\b/.test(txt)){att=l.ws.filter(w=>w.x>90).map(w=>w.t).join(' ').trim();continue}
      if(l.ws[0].t==='No'&&l.ws[0].x<40&&l.y<200){inRows=true;continue}
      if(/^(Total|Filter|Page)/.test(txt)||l.y>540){inRows=false;cur=null;continue}
      if(!inRows)continue;
      const d={};for(const w of l.ws){const c=colOf(w.x);(d[c]=d[c]||[]).push(w.t)}
      const rw=d.room&&d.room[0];
      if(rw&&/^\d{2,5}[A-Z]?$/.test(rw)){cur={};for(const k in d)cur[k]=d[k].join(' ');cur.att=att;cur.seq=seq++;rows.push(cur)}
      else if(cur){
        /* baris lanjutan: kalau ada tanggal Arrival baru, itu reservasi tamu berikutnya (kamar bertanda !) */
        const tgt=(d.arr&&/^\d{2}\/\d{2}\/\d{2}$/.test(d.arr[0]))?(cur.nx={}):(cur.nx||cur);
        for(const k in d)tgt[k]=((tgt[k]||'')+' '+d[k].join(' ')).trim();
      }
    }
  }
  const seen=new Set(),out=[];
  for(const r of rows){
    if(seen.has(r.room)){warnings.push('Kamar '+r.room+' muncul dua kali; yang kedua diabaikan.');continue}seen.add(r.room);
    const resv=(r.resv||'').replace(/^\d+\s*/,'').trim();
    out.push({room:r.room,type:r.type||'',resv:resv||'-',category:/due out|departed|check(ed)? ?out/i.test(resv)?'CHECKOUT':'STAYOVER',
      arrivalFlag:/!/.test(r.flag||''),skip:/#/.test(r.flag||''),dep:r.dep||'',vip:r.vip||'',adults:r.adl||'',children:r.chl||'',

let pdfReady=null;
function loadPdfJs(){
  if(pdfReady)return pdfReady;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const add=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('pdfjs-load'));document.head.appendChild(s)});
  pdfReady=add(base+'pdf.min.js').then(()=>add(base+'pdf.worker.min.js')).then(()=>{
    const L=window.pdfjsLib||window['pdfjs-dist/build/pdf'];if(!L)throw new Error('pdfjs-load');
    if(!window.pdfjsWorker){L.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([`importScripts('${base}pdf.worker.min.js')`],{type:'text/javascript'}))}
    return L;
  }).catch(e=>{pdfReady=null;throw e});
  return pdfReady;
}

      <td class="px-3 py-3"><div class="flex flex-wrap gap-1">${resvChip(r)||catChip(r.category)}${flagChips(r)}</div></td><td class="px-3 py-3">${assignCell(r)}</td><td class="px-3 py-3">${stChip(r.status)}</td><td class="px-3 py-3">${qToggle(r)}</td>
      <td class="px-3 py-3 text-xs text-slate-500 whitespace-nowrap font-mono">${r.startAt?clk(r.startAt)+(r.finishHkAt?' – '+clk(r.finishHkAt):''):'–'}</td><td class="px-5 py-3 text-right">${r.status==='PENDING'?delBtn('r'+r.room,'delRoom',r.room,'Hapus kamar '+r.room):''}</td></tr>`).join('')}</tbody></table></div>`;
  const mobile=`<div class="md:hidden divide-y divide-slate-100 border-t border-slate-100">${shown.map(r=>`<div class="px-4 py-3 space-y-2 ${isQ(r)?'bg-rose-50/70 border-l-4 border-rose-500':''}"><div class="flex items-start justify-between gap-3"><div><p class="font-extrabold text-slate-900 text-lg leading-none">${esc(r.room)}</p><p class="text-xs text-slate-500 mt-1">${esc(r.roomType)} · Lt ${esc(floorOf(r))}</p></div><div class="flex flex-col items-end gap-1.5">${stChip(r.status)}${qToggle(r)}</div></div>
    <div class="flex flex-wrap gap-1">${resvChip(r)||catChip(r.category)}${flagChips(r)}</div><div class="flex items-center gap-2"><div class="flex-1 min-w-0">${assignCell(r)}</div>${r.status==='PENDING'?delBtn('r'+r.room,'delRoom',r.room,'Hapus kamar '+r.room):''}</div></div>`).join('')}</div>`;
  const people=hks.map(h=>{const m=R.filter(r=>r.assignedTo===h.id);const co=m.filter(r=>r.category==='CHECKOUT').length;const d=m.filter(r=>r.status==='INSPECTION_READY'||r.status==='COMPLETED').length;

  const Q=queued();
  return `${pageHead('',`${R.length} kamar · ${R.filter(r=>!r.assignedTo).length} belum di-assign`)}
  ${Q.length?queueBanner(Q,`${Q.length} tamu sudah menunggu`,'Matikan tombol Queue jika tamu sudah dipindahkan ke kamar lain.'):`<div class="mb-4 flex gap-2 rounded-2xl bg-white ring-1 ring-slate-200/80 px-4 py-3 text-sm text-slate-600">${ic('bell','w-4 h-4 mt-0.5 text-rose-600')}<span>Tamu sudah datang tapi kamarnya belum ready? Nyalakan <b>Queue</b> pada kamarnya. Housekeeper dan supervisor langsung mendapat notifikasi, dan kamar itu dipindah ke urutan paling atas.</span></div>`}
  <div class="space-y-4">
  ${card(`<div class="p-4 sm:p-5 pb-3">${filters}</div>
    ${R.length?(list.length?table+mobile+`<div class="px-5 py-3 border-t border-slate-100 flex items-center justify-between gap-3 text-xs text-slate-500"><span>Menampilkan ${shown.length} dari ${list.length} kamar</span>${list.length>LIMIT?`<button data-act="toggleAll" class="font-semibold text-brand-700">${S.showAll?'Tampilkan lebih sedikit':'Tampilkan semua'}</button>`:''}</div>`

      <div>${label('f-rcat','Kategori')}<select id="f-rcat" data-keep class="${selectCls} w-full"><option value="CHECKOUT" ${dv('f-rcat','CHECKOUT')==='CHECKOUT'?'selected':''}>Checkout</option><option value="STAYOVER" ${dv('f-rcat','')==='STAYOVER'?'selected':''}>Stayover</option></select></div>
      <button data-act="addRooms" class="${bc('primary')}">${ic('plus')} Tambah</button></div></details></div>`;

/* ================= INSPEKSI & REKAP ================= */
function timeline(r,isSO){
  const step=(t,v,c)=>`<div class="flex-1 min-w-0"><p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">${t}</p><p class="font-mono font-bold ${c||'text-slate-900'}">${v}</p></div>`;
  return `<div class="flex items-center gap-2 rounded-xl bg-slate-50 px-3 py-2.5">${step('Start',clk(r.startAt))}${ic('chevron','w-3.5 h-3.5 text-slate-300')}${step('Finish',clk(r.finishHkAt))}${ic('chevron','w-3.5 h-3.5 text-slate-300')}${step('Verified',isSO?'auto':clk(r.finishSpvAt),'text-brand-700')}</div>`;
}
function viewInspect(){
  const q=dv('f-spvq','').trim().toUpperCase();
  const all=spvQueue(),queue=all.filter(r=>!q||String(r.room).toUpperCase().startsWith(q)).sort((a,b)=>qFirst(a,b)||(b.arrivalFlag?1:0)-(a.arrivalFlag?1:0)||a.finishHkAt-b.finishHkAt);
  const Q=queued();
  const working=cnt(S.rooms,'CLEANING')+cnt(S.rooms,'PAUSED');
  return `${pageHead('',`${all.length} kamar menunggu · ${working} sedang dibersihkan`)}
  ${queueBanner(Q,`${Q.length} tamu sudah menunggu`,'Kamar ini tampil paling atas begitu housekeeper menekan Finish. Cek secepatnya.')}
  <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-4"><div class="flex-1 flex gap-2 rounded-2xl bg-white ring-1 ring-slate-200/80 px-4 py-3 text-sm text-slate-600">${ic('info','w-4 h-4 mt-0.5 text-brand-600')}<span>Hanya kamar <b>Checkout</b> yang dicek. Stayover otomatis ready. Kamar <b class="text-fuchsia-700">! Arrival</b> tampil paling atas.</span></div><div class="sm:w-64">${searchBox('f-spvq','Cari nomor kamar')}</div></div>
  ${queue.length?`<div class="grid gap-3 sm:gap-4 md:grid-cols-2 2xl:grid-cols-3">${queue.map(r=>`<article class="bg-white rounded-2xl ${isQ(r)?'ring-2 ring-rose-500':r.arrivalFlag?'ring-1 ring-fuchsia-300':'ring-1 ring-slate-200/80'} shadow-card p-4 sm:p-5 flex flex-col gap-3.5">${isQ(r)?`<div>${qChip(r)}</div>`:''}
    <div class="flex items-start justify-between gap-3"><div><p class="text-3xl font-extrabold text-slate-900 tracking-tight leading-none">${esc(r.room)}</p><p class="text-xs text-slate-500 mt-1.5">${esc(r.roomType)} · Lt ${esc(floorOf(r))}</p></div><div class="flex flex-wrap justify-end gap-1">${resvChip(r)}${flagChips(r)}</div></div>
    <div class="flex items-center gap-2.5">${avatar(nameOf(r.assignedTo),'w-8 h-8 text-[10px]')}<div class="text-sm"><p class="font-semibold text-slate-900">${esc(nameOf(r.assignedTo))}</p><p class="text-xs text-slate-500">${mins(netClean(r))} menit bersih${r.totalPauseMs?' · jeda '+mins(r.totalPauseMs)+'m':''}</p></div></div>
    ${notes(r)}${timeline(r,false)}
    <button data-act="ask" data-type="approve" data-id="${esc(r.room)}" class="${bc('success','lg','w-full mt-auto')}">${ic('dcheck','w-5 h-5')} Konfirmasi ready</button></article>`).join('')}</div>`
  :card(empty('dcheck',q?'Tidak ada kamar yang cocok':'Antrean kosong','Kamar checkout muncul di sini begitu housekeeper menekan Finish.'))}`;
}
function recapCard(r,undo){
  const isSO=r.category==='STAYOVER';
  return `<article class="bg-white rounded-2xl ring-1 ring-slate-200/80 shadow-card p-4 sm:p-5 space-y-3.5">
    <div class="flex items-start justify-between gap-3"><div class="min-w-0"><div class="flex items-center gap-2"><p class="text-xl font-extrabold text-slate-900">${esc(r.room)}</p>${catChip(r.category)}</div><p class="text-xs text-slate-500 mt-1 truncate">${esc(nameOf(r.assignedTo))}${r.spvId?' · SPV '+esc(nameOf(r.spvId)):''}</p></div>
      ${undo?`<button data-act="ask" data-type="undo" data-id="${esc(r.room)}" class="${bc('soft','sm')}">${ic('undo','w-3.5 h-3.5')} Undo</button>`:stChip('COMPLETED')}</div>
    ${timeline(r,isSO)}${r.queuedAt?`<p class="flex items-center gap-1.5 text-xs font-semibold text-rose-700">${ic('bell','w-3.5 h-3.5')} Tamu menunggu ${mins((r.finishSpvAt||nowS())-r.queuedAt)} menit sampai kamar ready</p>`:''}
    <div class="grid grid-cols-4 gap-2 text-center">${[['Bersih',mins(netClean(r)),'text-amber-600'],['Jeda',mins(r.totalPauseMs),'text-orange-600'],['Cek SPV',isSO?'–':mins(r.finishSpvAt-r.finishHkAt),'text-sky-600'],['Total',mins(r.finishSpvAt-r.startAt),'text-brand-700']].map(([l,v,c])=>`<div class="rounded-xl ring-1 ring-inset ring-slate-100 py-2"><p class="text-lg font-extrabold ${c}">${v}</p><p class="text-[10px] text-slate-500">${l}${v==='–'?'':' mnt'}</p></div>`).join('')}</div></article>`;
}
function viewRecap(){
  const q=dv('f-rq','').trim().toUpperCase();
  const done=S.rooms.filter(r=>r.status==='COMPLETED'&&(!q||String(r.room).toUpperCase().startsWith(q))).sort((a,b)=>b.finishSpvAt-a.finishSpvAt);
  const shown=S.showAll?done:done.slice(0,40);
  return `${pageHead('',`${done.length} kamar ready hari ini`)}<div class="mb-4 sm:w-72">${searchBox('f-rq','Cari nomor kamar')}</div>
  ${done.length?`<div class="grid gap-3 sm:gap-4 md:grid-cols-2 2xl:grid-cols-3">${shown.map(r=>recapCard(r,true)).join('')}</div>${done.length>40?`<div class="text-center mt-4"><button data-act="toggleAll" class="${bc('ghost')}">${S.showAll?'Tampilkan lebih sedikit':`Tampilkan semua (${done.length})`}</button></div>`:''}`
  :card(empty('clock','Belum ada kamar ready','Kamar yang sudah diverifikasi muncul di sini.'))}`;
}

/* ================= LAPORAN ================= */
function viewReport(){
  const date=S.reportDate||S.today,all=date===S.today?S.rooms:S.report[date];
  const head=`<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4"><p class="text-sm text-slate-500 lg:hidden">${VIEWS.report.d}</p><div class="flex items-center gap-2 sm:ml-auto">${ic('calendar','w-4 h-4 text-slate-400')}<input type="date" id="f-rdate" value="${date}" aria-label="Tanggal laporan" class="${selectCls}"></div></div>`;
  if(!all)return head+skeleton();
  const done=all.filter(r=>r.status==='COMPLETED').sort(roomSort),co=done.filter(r=>r.category==='CHECKOUT');
  const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):0;
  const avgC=avg(done.map(r=>mins(netClean(r)))),avgS=avg(co.map(r=>mins(r.finishSpvAt-r.finishHkAt))),avgT=avg(done.map(r=>mins(r.finishSpvAt-r.startAt)));
  const per={};done.forEach(r=>{const k=r.assignedTo||'-';const p=per[k]=per[k]||{n:0,c:[],co:0};p.n++;p.c.push(mins(netClean(r)));if(r.category==='CHECKOUT')p.co++});
  const rows=Object.entries(per).sort((a,b)=>b[1].n-a[1].n);
  return head+`<div class="grid grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-4">
    ${kpi('check','bg-emerald-50 text-emerald-600','Kamar ready',done.length,`dari ${all.length} kamar${done.some(r=>r.queuedAt)?` · ${done.filter(r=>r.queuedAt).length} tamu sempat menunggu (rata-rata ${avg(done.filter(r=>r.queuedAt).map(r=>mins(r.finishSpvAt-r.queuedAt)))} mnt)`:''}`)}
    ${kpi('clock','bg-amber-50 text-amber-600','Rata-rata bersih',avgC+' mnt','tanpa waktu jeda')}
    ${kpi('dcheck','bg-sky-50 text-sky-600','Rata-rata cek SPV',avgS+' mnt','kamar checkout')}
    ${kpi('chart','bg-brand-50 text-brand-600','Start → ready',avgT+' mnt','rata-rata total')}</div>
  <div class="grid gap-4 mt-4 xl:grid-cols-[minmax(0,1fr)_minmax(0,2fr)] items-start">
    ${card(`${cardHead('Per housekeeper','Diurutkan dari kamar terbanyak')}<div class="px-2 pb-2 pt-2">${rows.length?rows.map(([id,p])=>`<div class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-50">${avatar(nameOf(id),'w-8 h-8 text-[10px]')}<div class="flex-1 min-w-0"><p class="text-sm font-semibold text-slate-900 truncate">${esc(nameOf(id))}</p><p class="text-xs text-slate-500">${p.co} checkout · ${p.n-p.co} stayover</p></div><div class="text-right"><p class="text-sm font-extrabold text-slate-900">${p.n}</p><p class="text-[11px] text-slate-500">${avg(p.c)} mnt/kamar</p></div></div>`).join(''):empty('chart','Belum ada data','')}</div>`)}

/* ================= HOUSEKEEPER ================= */
function viewHK(){
  const mine=S.rooms.filter(r=>r.assignedTo===S.me.id);
  const done=mine.filter(r=>r.status==='INSPECTION_READY'||r.status==='COMPLETED').length;
  const active=mine.find(r=>r.status==='CLEANING');
  const paused=mine.filter(r=>r.status==='PAUSED').sort((a,b)=>qFirst(a,b)||seqSort(a,b)),pending=mine.filter(r=>r.status==='PENDING').sort((a,b)=>qFirst(a,b)||seqSort(a,b));
  const myQ=mine.filter(isQ);
  const waiting=mine.filter(r=>r.status==='INSPECTION_READY').sort(seqSort),finished=mine.filter(r=>r.status==='COMPLETED').sort((a,b)=>b.finishSpvAt-a.finishSpvAt);
  const co=mine.filter(r=>r.category==='CHECKOUT').length,arrP=mine.filter(r=>r.arrivalFlag&&r.status==='PENDING').length;

    <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3 mt-1 mb-4">${list.map(r=>hkCard(r,active)).join('')}</div></details>`:'';
  const hero=active?`<section class="relative overflow-hidden rounded-3xl bg-brand-950 text-white p-5 sm:p-6 shadow-lift dots">
      <div class="flex items-start justify-between gap-4"><div class="min-w-0"><p class="text-xs font-semibold text-brand-300 uppercase tracking-wider flex items-center gap-2"><span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-amber-400"></span></span>Sedang dibersihkan</p>
        <p class="text-5xl sm:text-6xl font-extrabold tracking-tight mt-2">${esc(active.room)}</p>${isQ(active)?`<div class="mt-2">${qChip(active)}</div>`:''}<p class="text-sm text-brand-100/80 mt-1">${esc(active.roomType)} · ${catOf(active.category).l}${guestLine(active)?' · '+guestLine(active).replace('text-fuchsia-700','text-fuchsia-300'):''}</p></div>
        <div class="text-right shrink-0"><p class="text-[11px] text-brand-300">Mulai ${clk(active.startAt)}</p><p class="font-mono text-3xl sm:text-4xl font-bold text-amber-300 mt-1" data-since="${active.startAt+(active.totalPauseMs||0)}">${timer(nowS()-active.startAt-(active.totalPauseMs||0))}</p>${active.totalPauseMs?`<p class="text-[11px] text-brand-300 mt-1">jeda ${mins(active.totalPauseMs)} mnt</p>`:''}</div></div>
      ${(active.specials||active.instructions)?`<div class="mt-4 rounded-xl bg-white/10 px-3 py-2 text-xs text-brand-50">${esc([active.specials,active.instructions].filter(Boolean).join(' · '))}</div>`:''}
      <div class="mt-5 grid grid-cols-[auto_1fr_1.6fr] gap-2">
        <button data-act="ask" data-type="undo" data-id="${esc(active.room)}" class="${bc('glass','md')}" aria-label="Batalkan start">${ic('ban')}</button>
        <button data-act="ask" data-type="pause" data-id="${esc(active.room)}" class="${bc('warn','md')}">${ic('pause')} Pause</button>
        <button data-act="ask" data-type="finish" data-id="${esc(active.room)}" class="${bc('success','md')} !bg-emerald-500 hover:!bg-emerald-400">${ic('check','w-5 h-5')} Finish</button></div></section>`:'';
  return `<div class="space-y-5 max-w-6xl">
    ${queueBanner(myQ,myQ.length>1?`${myQ.length} tamu sudah menunggu kamar Anda`:`Tamu sudah menunggu kamar ${esc(myQ[0]?myQ[0].room:'')}`,active&&!isQ(active)?`Selesaikan atau pause kamar ${esc(active.room)}, lalu kerjakan kamar ini lebih dulu.`:'Kerjakan kamar ini lebih dulu.').replace('mb-4','')}
    <section class="bg-white rounded-3xl ring-1 ring-slate-200/80 shadow-card p-5 flex items-center gap-5">
      ${donut(done,mine.length,104,11)}
      <div class="flex-1 min-w-0"><p class="text-sm text-slate-500">${greet()},</p><p class="text-xl font-extrabold text-slate-900 truncate">${esc(S.me.name)}</p>
        <div class="flex flex-wrap gap-1.5 mt-2.5">${chip(co+' checkout',CAT.CHECKOUT.chip)}${chip((mine.length-co)+' stayover',CAT.STAYOVER.chip)}${arrP?chip(arrP+' arrival','bg-fuchsia-50 text-fuchsia-700 ring-fuchsia-200'):''}</div></div></section>
    ${hero}
    ${mine.length?section('Dijeda',paused,true,active?`Resume tersedia setelah kamar ${esc(active.room)} selesai atau di-pause.`:'')+section('Berikutnya',pending,true,active?`Selesaikan atau pause kamar ${esc(active.room)} untuk memulai kamar berikutnya.`:'')+section('Menunggu cek supervisor',waiting,!pending.length)+section('Selesai',finished,false)

function hkCard(r,active){
  const locked=active&&active.room!==r.room;let act='';
  if(r.status==='PENDING')act=locked?'':`<button data-act="ask" data-type="start" data-id="${esc(r.room)}" class="${bc('dark','md','w-full')}">${ic('play')} Start</button>`;
  else if(r.status==='PAUSED')act=`<div class="flex items-center justify-between text-xs text-orange-800 bg-orange-50 rounded-xl px-3 py-2"><span>Dijeda sejak ${clk(r.pausedAt)}</span></div>
    ${locked?'':`<div class="grid grid-cols-[auto_1fr] gap-2"><button data-act="ask" data-type="undo" data-id="${esc(r.room)}" class="${bc('dangerSoft','md')}" aria-label="Batalkan">${ic('ban')}</button><button data-act="ask" data-type="resume" data-id="${esc(r.room)}" class="${bc('primary','md')}">${ic('play')} Resume</button></div>`}`;
  else if(r.status==='INSPECTION_READY')act=`${timeline(r,false)}<div class="flex items-center gap-2"><span class="flex-1 text-xs text-sky-700 bg-sky-50 rounded-xl px-3 py-2">Menunggu supervisor · ${mins(netClean(r))} mnt</span><button data-act="ask" data-type="undo" data-id="${esc(r.room)}" class="${bc('soft','sm')}">${ic('undo','w-3.5 h-3.5')} Undo</button></div>`;
  else if(r.status==='COMPLETED')act=`${timeline(r,r.category==='STAYOVER')}<p class="text-xs text-emerald-700 font-semibold">${mins(netClean(r))} menit bersih</p>`;
  const gl=guestLine(r),extra=resvChip(r)+flagChips(r);
  return `<article class="bg-white rounded-2xl ${isQ(r)?'ring-2 ring-rose-500':r.arrivalFlag&&r.status==='PENDING'?'ring-1 ring-fuchsia-300':'ring-1 ring-slate-200/80'} shadow-card p-4 flex flex-col gap-3">${isQ(r)?`<div>${qChip(r)}</div>`:''}
    <div class="flex items-start justify-between gap-3"><div class="min-w-0"><p class="text-2xl font-extrabold text-slate-900 leading-none tracking-tight">${esc(r.room)}</p><p class="text-xs text-slate-500 mt-1.5">${esc(r.roomType)}${gl?' · '+gl:''}</p></div>${r.status==='PENDING'?catChip(r.category):stChip(r.status)}</div>
    ${extra?`<div class="flex flex-wrap gap-1">${extra}</div>`:''}${notes(r)}<div class="mt-auto space-y-2">${act}</div></article>`;
}

const ROLE_ORDER=['superadmin','admin','supervisor','housekeeper'];
/* hak ubah akun (sama dengan aturan di server) */
function rights(t){
  const u=S.me,self=u.id===t.id,m=['supervisor','housekeeper'].includes(t.role);
  return {name:u.role==='superadmin'||(u.role==='admin'&&(m||self)),username:u.role==='superadmin',
    password:!self&&((u.role==='superadmin'&&t.role!=='superadmin')||(u.role==='admin'&&m)||(u.role==='supervisor'&&t.role==='housekeeper')),
    role:u.role==='superadmin'&&!self&&t.role!=='superadmin',active:!self&&((u.role==='superadmin'&&t.role!=='superadmin')||(u.role==='admin'&&m))};
}

  ${card(list.length?`<div class="hidden md:block overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100 bg-slate-50/60"><th class="font-semibold px-5 py-3">Pengguna</th><th class="font-semibold px-3 py-3">Role</th><th class="font-semibold px-3 py-3">Status</th><th class="px-5 py-3"></th></tr></thead>

    pause:['pause','bg-amber-50 text-amber-600',`Jeda kamar ${n}?`,'Timer berhenti sementara. Anda bisa melanjutkan nanti atau memulai kamar lain.','warn','Pause'],
    resume:['play','bg-brand-50 text-brand-700',`Lanjutkan kamar ${n}?`,'Timer pembersihan berjalan lagi.','primary','Resume'],
    finish:['check','bg-emerald-50 text-emerald-600',`Selesai kamar ${n}?`,r.category==='STAYOVER'?'Kamar stayover langsung ditandai ready tanpa cek supervisor.':'Pastikan semua area sudah bersih. Kamar dikirim ke supervisor untuk dicek.','success','Finish'],

  }[type];
  S.confirm={icon:C[0],iconCls:C[1],title:C[2],msg:C[3],btnV:C[4],btn:C[5],onYes:async()=>{
    const t0=Date.now();
    const upd=await run(()=>api('roomAction',S.today,room,type),()=>({start:'Kamar '+room+' dimulai',pause:'Kamar '+room+' dijeda',resume:'Kamar '+room+' dilanjutkan',finish:r.category==='STAYOVER'?'Kamar '+room+' ready':'Kamar '+room+' dikirim ke supervisor',approve:'Kamar '+room+' verified ready',undo:'Kamar '+room+': undo berhasil'}[type]));
    if(upd){syncClock(upd.updatedAt,t0,Date.now());const i=S.rooms.findIndex(x=>x.room===upd.room);if(i>=0)S.rooms[i]=upd;render()}else refresh(true);

function parseRooms(s){
  const out=[];
  for(const part of s.split(/[\s,;]+/)){
    if(!part)continue;const m=part.match(/^(\d{1,5})-(\d{1,5})$/);
    if(m){let a=+m[1],b=+m[2];if(b<a)[a,b]=[b,a];if(b-a>60)return{error:`Rentang ${part} terlalu panjang (maks 60 kamar).`};for(let i=a;i<=b;i++)out.push(String(i))}
    else if(/^[A-Za-z0-9]{1,6}$/.test(part))out.push(part.toUpperCase());
    else return{error:`"${part}" bukan nomor kamar yang valid.`};
  }
  return{rooms:[...new Set(out)]};
}
async function handleFile(f){
  if(!f)return;
  if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf')return toast('Pilih file PDF Task Sheet Report.');
  S.imp={state:'reading',fileName:f.name,pagesDone:0,pagesTotal:0};render();
  let L;try{L=await loadPdfJs()}catch(e){S.imp={state:'error',fileName:f.name,error:'Pembaca PDF gagal dimuat. Periksa koneksi internet lalu coba lagi.'};return render()}
  try{
    const doc=await L.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false,disableFontFace:true}).promise;
    S.imp.pagesTotal=doc.numPages;const pages=[];
    for(let n=1;n<=doc.numPages;n++){
      const p=await doc.getPage(n),vp=p.getViewport({scale:1}),tc=await p.getTextContent();
      pages.push({items:tc.items.map(it=>({x:it.transform[4],y:vp.height-it.transform[5],w:it.width,str:it.str}))});
      S.imp.pagesDone=n;render();
    }
    const parsed=parseTaskSheet(pages);
    if(!parsed.rows.length)throw new Error('Tidak ada baris kamar yang terbaca. Pastikan file ini Task Sheet Report dari Opera.');
    S.imp={state:'preview',fileName:f.name,parsed,date:parsed.date||S.today};delete S.drafts['f-rmmissing'];
    if(S.imp.date!==S.today&&!S.report[S.imp.date])loadReport(S.imp.date);
    render();
  }catch(e){S.imp={state:'error',fileName:f.name,error:(e&&e.message&&!/pdfjs/.test(e.message))?e.message:'File tidak bisa dibaca. Pastikan ini PDF Task Sheet Report lalu coba lagi.'};render()}
}

  cleanup(){
    const keep=Number(dv('f-keep','60'));
    S.confirm={icon:'trash',iconCls:'bg-rose-50 text-rose-600',title:'Hapus data lama?',msg:`Data kamar dan log yang lebih lama dari <b>${keep} hari</b> dihapus permanen dari Google Sheets. Backup Sheet dulu jika masih dibutuhkan.`,btnV:'danger',btn:'Hapus',
      onYes:async()=>{const r=await run(()=>api('cleanupOldData',keep),x=>`${x.removedRooms} baris kamar & ${x.removedLogs} log dihapus`);if(r){S.log=null;render()}}};
    render();
  }
};

/* ================= NOTIFIKASI QUEUE ================= */
const qKey=r=>S.today+'|'+r.room+'|'+r.queuedAt;
function seenSet(){try{return new Set(JSON.parse(localStorage.getItem('hk.qseen')||'[]'))}catch(e){return new Set()}}
function markSeen(list){const s=seenSet();list.forEach(r=>s.add(qKey(r)));try{localStorage.setItem('hk.qseen',JSON.stringify([...s].slice(-300)))}catch(e){}S.qSeenMem=s}
function relevantQueue(){
  if(!S.me)return [];
  if(S.me.role==='housekeeper')return queued().filter(r=>r.assignedTo===S.me.id);
  if(S.me.role==='supervisor')return queued();
  return [];
}
function checkQueueAlerts(){
  const rel=relevantQueue();if(!rel.length)return;
  const seen=S.qSeenMem||seenSet();
  const fresh=rel.filter(r=>!seen.has(qKey(r)));
  if(!fresh.length)return;
  S.qAlert=rel;chime();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,500])}catch(e){}
  try{document.title='🔔 Tamu menunggu · HK Tracker'}catch(e){}
}
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}},{passive:true});
function chime(){
  try{if(!actx)return;const t=actx.currentTime;[[880,0],[660,.22],[880,.44]].forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.35,t+d+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+.2);o.connect(g);g.connect(actx.destination);o.start(t+d);o.stop(t+d+.22)})}catch(e){}
}

/* ================= RENDER + EVENTS ================= */
let rq=0;
function render(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;doRender()})}
function doRender(){
  const a=document.activeElement,fid=a&&a.id;let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  const app=document.getElementById('app');
  if(!S.token||!S.me)app.innerHTML=S.token&&!S.me?`<div class="min-h-screen flex items-center justify-center"><span class="text-brand-600">${ic('refresh','w-6 h-6 spin')}</span></div>`:viewLogin();
  else if(S.me.mustChange)app.innerHTML=viewMustChange();
  else app.innerHTML=viewShell();
  renderModals();
  if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement&&el.type!=='password'){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
}
document.addEventListener('submit',e=>{if(e.target.id==='login-form')submitLogin(e);else if(e.target.id==='pw-form')submitPw(e)});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.hasAttribute('data-overlay')&&e.target.closest('[data-stop]'))return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el)}
});
document.addEventListener('input',e=>{const el=e.target;if(el.hasAttribute('data-keep')){S.drafts[el.id]=el.type==='checkbox'?el.checked:el.value;if(el.hasAttribute('data-live')){S.showAll=false;render()}}});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.hasAttribute('data-keep'))S.drafts[el.id]=el.type==='checkbox'?el.checked:el.value;
  if(el.hasAttribute('data-rerender')){S.showAll=false;render()}
  else if(el.hasAttribute('data-urolepick')){S.drafts['f-urole']=el.value;render()}
  else if(el.id==='f-pdf'){handleFile(el.files&&el.files[0]);el.value=''}
  else if(el.dataset.queue){const room=el.dataset.queue,on=el.checked,r0=S.rooms.find(x=>x.room===room);
    const upd=await run(()=>api('setQueue',S.today,room,on),()=>on?`Kamar ${room}: tamu menunggu. ${r0&&r0.assignedTo?nameOf(r0.assignedTo)+' & supervisor diberi tahu.':'Kamar ini belum di-assign!'}`:`Queue kamar ${room} dibatalkan`);
    if(upd){const i=S.rooms.findIndex(x=>x.room===upd.room);if(i>=0)S.rooms[i]=upd}render()}
  else if(el.dataset.reassign){const room=el.dataset.reassign,to=el.value;const r=await run(()=>api('assignRooms',S.today,[[room,to]]),'Kamar '+room+' → '+nameOf(to));if(r){S.rooms=r.rooms;render()}}
  else if(el.dataset.urole){await run(()=>api('saveUser',{id:el.dataset.urole,role:el.value}),'Role diperbarui');S.allUsers=null;render()}
  else if(el.dataset.pick&&S.modal){el.checked?S.modal.sel.add(el.dataset.pick):S.modal.sel.delete(el.dataset.pick)}
  else if(el.id==='f-rdate'&&el.value){S.reportDate=el.value;if(el.value!==S.today&&!S.report[el.value])loadReport(el.value);render()}
  else if(el.id==='f-impdate'&&el.value&&S.imp){S.imp.date=el.value;if(el.value!==S.today&&!S.report[el.value])loadReport(el.value);render()}
});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('!border-brand-500','!bg-brand-50')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('!border-brand-500','!bg-brand-50')});
document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('#drop')){e.preventDefault();handleFile(e.dataTransfer.files&&e.dataTransfer.files[0])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.modal||S.confirm||S.acct||S.more||S.addUser||S.qAlert||S.editUser)){if(S.qAlert)markSeen(S.qAlert);Object.assign(S,{modal:null,confirm:null,acct:false,more:false,addUser:false,qAlert:null,editUser:null});render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.me&&nowS()-S.lastSync>10000)refresh(true)});
setInterval(()=>{document.querySelectorAll('[data-since]').forEach(el=>{const s=+el.dataset.since;if(s)el.textContent=timer(nowS()-s)});const c=fmtClock();document.querySelectorAll('[data-clock]').forEach(el=>el.textContent=c);document.querySelectorAll('[data-wait]').forEach(el=>{const s=+el.dataset.wait;if(s)el.textContent=mins(nowS()-s)})},1000);
/* sinkron jam server saat dibuka & tiap 10 menit (juga di halaman login) */
async function syncServerTime(){try{const t0=Date.now();const r=await call('getServerTime',[]);syncClock(r.now,t0,Date.now())}catch(e){}}
syncServerTime();setInterval(syncServerTime,600000);
/* refresh: tiap 20 detik, atau 10 detik selama ada tamu menunggu */
setInterval(()=>{if(!S.me||S.me.mustChange||document.hidden||S.busy||S.modal||S.confirm||S.addUser||S.editUser||(S.imp&&S.imp.state==='writing'))return;const every=queued().length?10000:20000;if(nowS()-S.lastSync>=every)refresh(true)},2500);

(async function boot(){
  render();
  if(!S.token)return;
  try{const r=await call('whoAmI',[S.token]);S.me=r.me;S.today=r.today;S.view=defaultView();render();refresh()}
  catch(e){if(e.code==='AUTH')doLocalLogout('');else{S.token='';S.me=null;S.loginErr=e.message;render()}}
})();
</script>

</body>
